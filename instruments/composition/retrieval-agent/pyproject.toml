[project]
name = "schematics-retrieval-agent"
version = "0.7.0"
description = "Function-graph and factor-graph schematics retrieval for observer setup. Eligibility routing only; companion kernels own A, V, samples, and dispositions."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
jspt = ["jacobian-sensitivity-propagation-testbed @ git+https://github.com/giasonpooni/Jacobian-Sensitivity-Propagation-Testbed.git@7399ab03087b27683620b4c57f97b2ac14546c7f"]
plsr = ["parameterized-lyapunov-stability-runtime @ git+https://github.com/giasonpooni/Parameterized-Lyapunov-Stability-Runtime.git@9d0e7b4a1162e038150a71c63d986945d78135d4"]
rci = ["retrofitted-computational-instrumentation @ git+https://github.com/giasonpooni/Retrofitted-Computational-Instrumentation.git@5c63b1192ff2a25dd3babf1f06f596f70fc8231e"]
kernels = [
    "jacobian-sensitivity-propagation-testbed @ git+https://github.com/giasonpooni/Jacobian-Sensitivity-Propagation-Testbed.git@7399ab03087b27683620b4c57f97b2ac14546c7f",
    "parameterized-lyapunov-stability-runtime @ git+https://github.com/giasonpooni/Parameterized-Lyapunov-Stability-Runtime.git@9d0e7b4a1162e038150a71c63d986945d78135d4",
    "retrofitted-computational-instrumentation @ git+https://github.com/giasonpooni/Retrofitted-Computational-Instrumentation.git@5c63b1192ff2a25dd3babf1f06f596f70fc8231e",
]

[project.scripts]
sra = "schematics.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/schematics"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not live'"
markers = ["live: requires pinned companion kernels"]
