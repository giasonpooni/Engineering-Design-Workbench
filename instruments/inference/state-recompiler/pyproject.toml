[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "constraint-based-state-reconciliation"
version = "0.1.0"
description = "Bounded exact-declaration affine reconciliation with replayable receipts"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<10", "numpy>=1.26,<3"]

[project.scripts]
cbsr = "cbsr.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
