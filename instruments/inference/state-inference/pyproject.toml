[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "geometric-state-inference-engine"
version = "0.1.0"
description = "Bounded state estimation with explicit covariance, residuals, and instrument exchange"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3"]
license = "MPL-2.0"
license-files = ["LICENSE", "NOTICE.md"]
readme = "README.md"

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
