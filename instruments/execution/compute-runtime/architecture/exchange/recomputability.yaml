    "detail": "the record carries the PROGRAM ITSELF, not a name for it, and its identity is a commitment over (program, configuration, input). A reader holding the record holds everything the computation consumed, which is why this path can be proved at all: a proof about a program nobody can exhibit proves nothing a reader can check. Demonstrated through a SERIALISED record rather than from the live object, and with the negative half: removing the program changes the identity, so the field is load-bearing rather than merely present"
