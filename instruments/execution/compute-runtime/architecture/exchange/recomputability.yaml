"the_claim_being_measured": "architecture/apparatus.yaml: 'a computed result carries what it was computed from and can be recomputed by the party reading it'"
"the_verdict": "TRUE OF ONE PATH AND WEAKER ON THE OTHER, and the declaration did not distinguish them. The proof-bearing execution path carries the PROGRAM and a reader can rerun it. The generic derivation path carries a method NAME and a reader can rerun it only if it already has that method"
"what_naming_a_method_still_buys": "the method is part of the record's IDENTITY, so two derivations by different methods are different facts and cannot be confused downstream. That is provenance-bearing. It is not self-sufficient, and the gap between those is exactly what this artifact exists to state"
"what_this_does_not_claim": "that a self-contained record is CORRECT. It says a reader can run the computation again, not that the computation was the right one to run -- an identity, not a warrant"
"what_would_close_it": "carrying a DIGEST of the method's definition, the way the execution path carries the program -- so a reader could at least check that the method it possesses is the method that was run. NOT DONE HERE: it changes what a DerivedValue is, which is a core-schema change under bend_protocol, and it is a decision rather than a measurement"
