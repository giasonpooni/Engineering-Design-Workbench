"artifact": "ecosystem_register"
"company_claim": "Notation Systems builds and operates provenance-bearing computational corpora"
"extends": "core@1.0.0"
"generated_by": "architecture/ecosystem.py"
"method": "every repository in reach is classified on EVIDENCE -- an authored core declaration, external commit authorship, a third-party copyright -- and never on the GitHub org it sits under. Integration is then measured rather than assumed: an input named only in prose is MENTIONED and an input named nowhere is UNREFERENCED"
"owner": "STE"
"reconciled_against_an_independent_census":
  "and_it_counts_differently": "it enumerates 6 repositories carrying the name and 7 APPARATUSES; this register reports 3. The predicates differ and neither count is wrong: this one measures BOUND-TO-THE-CORE (an authored architecture declaration), the census measures CARRIES-THE-NAME. A repository can carry the name and bind nothing"
  "not_transcribed": "the census's rows are POINTED AT, not copied here. It is that party's artifact and its claims are its own to state; duplicating them would create a second copy that drifts and a reader could not tell which was the source"
  "the_correction_it_forced": "the census lists morphohdl as a company repository. This register had it VENDORED_INPUT -- on a copyright match that turned out to be Apache-2.0 BOILERPLATE ('Licensor shall mean the copyright owner...'), which would have disowned every Apache-licensed repository on no evidence at all. Six repositories moved from VENDORED_INPUT to UNRESOLVED once strong evidence was required"
  "the_sibling_measured_the_same_question": "the acquisition channel recorded architecture/ecosystem_census.yaml independently, against this repository at an OLDER pin than this register existed at -- so it is not derived from this artifact and the two are genuinely independent readings"
  "what_this_register_structurally_cannot_see": "an apparatus with NO REPOSITORY. The census records Notation Physical Commerce living in commerce/ inside the acquisition channel, deliberately, with no repository of its own. This register is keyed on repositories and would never have a row for it. Recorded as a limitation rather than closed, because closing it means keying on something other than what is being enumerated"
