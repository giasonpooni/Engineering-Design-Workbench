"the_core_they_bind":
  "digest": "sha256:8a8c73f4cba45c70299ced9f4dddd870d430a94bc90c684363e330c2b010c560"
  "how_to_check": "architecture/core_identity.py::covers_what_is_bound(your path, the surface name) FIRST -- to establish the digest is about code you actually import -- then verify(digest, root, surface_name) over your own copy. A mismatch names the file. BOTH steps matter: verify() without a surface name checks the twin track, which is not what any party measured here binds, and checking a digest without checking its referent is what produced the defect this field records"
  "measured":
    "tracks":
      "evidence_platform": "sha256:41b191759ffaef4666d4d10a44bd18a4811baba77e7ba9ed671f875400d453f8"
      "twin_compiler": "sha256:8a8c73f4cba45c70299ced9f4dddd870d430a94bc90c684363e330c2b010c560"
    "who_binds_what":
      "DAQ":
        "binds": "evidence_platform"
        "imports":
          "evidence_platform": 294
          "twin_compiler": 0
      "SCL":
        "binds": "evidence_platform"
        "imports":
          "evidence_platform": 41
          "twin_compiler": 0
  "the_digest_field_is_the_TWIN_track": "kept for continuity and NAMED, because an earlier version published it as 'the core they bind' when no binding party imports that track. What each party actually binds is under `measured` -- read that one"
  "what_it_does_not_settle": "whether a party HAS this core. This register reads the sibling clones on one machine; it does not know what any party has checked out elsewhere, and does not pretend to"
  "why_it_is_here": "every apparatus binds core@1.0.0 BY LABEL, and the label moves only under bend_protocol -- so many core commits carry it and a binding party cannot tell which one it bound. The digest is what makes the binding checkable rather than nominal, and it is published beside the bindings so a party reading this register has both"
"the_finding":
  "a_folder_is_not_an_ecosystem": "8 vendored repositories are referenced by NOTHING in any apparatus. Presence is not participation, and they are recorded unreferenced rather than listed as components -- the same reasoning that makes an unreached gate a silence rather than a clean result"
  "no_apparatus_declares_its_role": "2 of 3 apparatuses carry no architecture/apparatus.yaml. All bind core@1.0.0, so they agree on the core and none states what it IS within the company. That is the coherence gap, and it is filled per-repository BY EACH PARTY: a role written here on another party's behalf would be a self-declaration this party is not entitled to make"
  "org_ownership_is_not_authorship": "6 of 16 vendored repositories sit under the notationsystems/ org while being other parties' work, by their own commit history and copyright. A map that read the org prefix as a provenance claim would have declared 25 apparatuses and been wrong about 22 of them"
  "which_rule_this_is": "a mirror is not a source, at REPOSITORY scale. The same rule the invariant register enforces per file, and a fork under your own org is the most convincing mirror there is because the URL agrees with the claim"
"the_namesake_question":
  "and_the_substance_is_LESS_shared_than_the_name_suggests": "measured across both trees: ZERO shared domain vocabulary (circuit, netlist, verilog, cell definition, rewiring, wasm appear in neither direction), zero cross-reference in either direction, and disjoint subject matter -- a content-addressed language front-end with provenance here, an experimental graph-rewrite system for growing circuits there"
  "the_artifact_that_would_settle_it": "this package implements FROZEN SPECIFICATION v1.0.0, sections 7.A and 7.B, cited by name in morpho/lexer.py, morpho/parser.py and morpho/ast.py. Nothing in morphohdl references that specification, and its only grammar hit is inside a vendored syntax highlighter"
  "the_name_is_MORE_shared_than_the_census_knew": "this repository's package does not merely say `morpho`. Its modules call themselves MORPHO HDL, in their own docstrings -- the same two words, not a prefix in common"
  "verdict": "SHARED NAME, UNSHARED REFERENT AS FAR AS THIS TREE SHOWS. Not asserted as unrelated: two implementations of one idea in two languages would look exactly like this, and this machine holds no document that decides it. What is settled is that nothing HERE licenses treating them as one thing, and the census's instruction not to assume from the name stands, now with the evidence behind it"
  "what_was_asked": "the sibling census records that this repository contains a morpho/ package naming a Morpho IR, and that whether that IR is notationsystems/morphohdl's or a namesake is NOT determined there and must not be assumed from the name. Settled here as far as evidence allows, because it is this repository's package"
