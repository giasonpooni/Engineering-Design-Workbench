"the_correction": "AN EARLIER VERSION OF THIS ARTIFACT PUBLISHED ONE DIGEST, over core/canonical and core/projection, described as the thing a binding party checks. Measured: the acquisition channel imports from this repository hundreds of times (291 measured 2026-09-03, 293 on 2026-09-05) and from those packages ZERO times; the compute layer imports 41 and zero. The digest covered exactly the code no binding party touches, and a change to evidence/types.py -- imported 125 times -- would not have moved it. That is the ORIGINAL CORE-VERSION DEFECT RECURRING: the right KIND of identity over the wrong BODY of code"
"what_each_one_is_for":
  "digest": "the IDENTITY -- which core that statement was made about"
  "surface": "WHICH BODY OF CODE the identity is over, which is the part the first version got wrong"
  "version": "the COMPATIBILITY statement -- what a party may rely on"
"what_this_does_not_claim": "that a matching digest means two parties agree about anything beyond those bytes. It is an identity, not a warrant: it says which code, and says nothing about whether that code is right"
"why_a_digest_as_well_as_a_version": "the version moves only under bend_protocol, so many different core commits legitimately carry the same label. THE ACQUISITION CHANNEL'S CENSUS OBSERVED EXACTLY THAT: two checkouts of this repository, on different commits, three days apart, both reporting 1.0.0, ancestry undeterminable from where it stood. It recorded the finding and said plainly it could not act on it -- naming which core a label refers to is this repository's act, because this repository declares the label"
"why_there_are_two": "this repository holds TWO DISJOINT TRACKS. The acquisition channel's own reconnaissance says so, and import analysis confirms it: ZERO imports in either direction between {core, morpho, backends, runtime, adapters, renderer} and {evidence, scout, retrieval, materials, experiment, workbench}. Two unrelated projects sharing one repository, so one digest could never have been right for both"
