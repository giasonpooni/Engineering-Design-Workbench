"how_a_party_checks_it": "core_identity.covers_what_is_bound(consumer_path, surface_name) first -- to establish the digest is about code the party actually imports -- then verify(digest, root, surface_name) over its own copy. BOTH arguments matter: checking a digest without checking its referent is what produced the defect above, and verify() without a surface name checks the twin track, which is not what any measured party binds"
"owner": "STE"
"surface_is_declared_not_globbed": "a glob would silently widen a track the first time a file was added beside these, and widening the core without a bend is what bend_protocol forbids. The evidence surface is the IDENTITY-BEARING modules only, not every file in six packages: a digest moving on any change to any of them would move on nearly every commit and distinguish nothing"
