"the_properties_being_measured": "the data-platform plan rests on two: NO SERVING PROJECTION WRITES CANONICAL TRUTH, and serving projections are REBUILDABLE from canonical state. Every layer above the canonical one is disposable only if both hold; where either fails, that projection carries state nothing can regenerate and the canonical layer is not canonical for it"
"what_this_does_not_claim": "that a rebuildable projection is CORRECT, or that it will stay rebuildable at scale. It says the projection is a function of the canonical layer on this data, which is what makes it disposable -- not that the function is the right one. And every verdict here is REBUILDABLE, which is a fact about seven modules and not a guarantee about the eighth"
"why_now": "both are checkable before any of the infrastructure exists, and that is the reason to check. A projection that turns out not to be rebuildable is a cheap finding today and an expensive one after a lakehouse has been built on the assumption"
