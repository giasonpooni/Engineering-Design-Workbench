"the_alias_correction":
  "how_it_was_caught": "a lock requiring every gate id to resolve against a declared invariant, which failed on ALL FIVE: none was in this repository's architecture/invariants.yaml at all, so the per-invariant rejection rate was keyed on strings no registry carried"
  "measured_cost": "the derived register holds 58 rows before and after; all six STE declarations landed on EXISTING rows (STE claims 33 -> 39). Under the renamed ids it would have been 61 -- MEASURED by deriving with the renames in place, not computed"
  "rule": "a rule gets ONE id across the project, and the party that implements it second does not get to rename it by implementing it. The earlier declaration keeps the name"
  "what_happened": "three of the five invariant ids this gate refuses under were written here as NEW names for rules the acquisition layer had already declared: distribution_has_no_point_identity for no_point_identity_for_distributions, computed_method_fully_specified for computed_fully_specified, prediction_within_declared_domain for applicability_domain_declared"
"verdict_vocabulary_adopted_from": "the acquisition layer's architecture/admission_reachability.yaml, so the two registers read side by side rather than in two private vocabularies"
"what_this_does_not_claim": "that a 100% rejection rate says anything about real sources. Every candidate counted here was PLANTED to violate a gate, so the rate measures that the plants arrived, not that the world is dirty. The claim is narrower: fifteen of twenty refusals are now reachable through a real ingest, so a rate over real documents would be evidence for those fifteen. It is not one yet"
