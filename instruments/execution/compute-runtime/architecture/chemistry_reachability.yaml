  "why_five_are_silent": "they are substance-identity refusals: a merge conflict needs TWO identities and a policy refusal needs a SubstanceIdentity constructed. No single document payload expresses either, so they are recorded as inexpressible rather than counted as unreached -- an absence with a named cause, not a silence"
  "why_the_import_trace_is_no_longer_the_verdict": "the earlier trace asked whether anything under scout/ imports structures/ and concluded STRUCTURALLY_UNREACHABLE. The wiring runs the OTHER direction: the vertical calls acquisition and supplies its own gate. The edge the trace looked for still does not exist and the path now does -- so the trace was measuring a DIRECTION, not a path, and would today report STRUCTURALLY_UNREACHABLE with confidence and be wrong. It is retained as a note and demoted from evidence"
"method": "each refusal code was probed TWICE and the two questions kept apart: LIVE asks whether the gate refuses a violating payload when called directly; REACHABLE asks whether a plant can ARRIVE through an entry path. Every non-REACHABLE verdict names the mechanism that stops it, and the stop is executed, not argued"
"metric_interpretation":
  "before_the_wiring": "all 20 codes were LIVE and NONE was reachable through any entry path. The gates were correct and had no caller: what was missing was POSITION, not correctness"
  "rule": "a rate is evidence about source quality only for a code whose verdict is REACHABLE. Today that is 15 of 20"
  "what_a_clean_set_would_look_like_and_why_this_is_not_it": "5 of 20 codes remain LIVE and unreached, and they stay labelled. A probe reporting 'clean' would be presenting those silences as one number"
  "zero_rate_when_reachable": "the gate is reached by acquisition and did not fire. A real measurement."
  "zero_rate_when_unreachable": "no entry path can reach the gate. NOT a measurement; the metric is silent, not clean."
