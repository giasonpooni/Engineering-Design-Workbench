  - "consequence": "the guard has two refusals and the enumeration had one. STRUCTURE_STRING_ONLY was added rather than the plant quietly re-aimed: a malformed plant is a finding about the enumeration, not noise to tune away"
    "found": "a MALFORMED plant, on the first run"
    "what_happened": "the plant for DISTRIBUTION_FIELDS_MISSING passed an empty field mapping and hit a DIFFERENT refusal one line earlier -- so it measured the plant, not the gate"
  - "consequence": "nothing had traversed the path, so nothing was measured -- the same shape as the Phase 27 error this confirmation exists to avoid. The probe now refuses to call zero findings a termination, and the plant uses the format the shipped extractor actually parses"
    "found": "a VACUOUS confirmation, on the second run"
    "what_happened": "the executed plant used `key: value` lines, which the shipped extractor does not read. It produced ZERO findings and the probe reported 'termination confirmed'"
