name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The matrix is the point: this library declares zero dependencies,
    # and the only way that claim stays true is if it is exercised on
    # every supported interpreter and platform rather than asserted in
    # a README.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (no dependencies expected)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Refuse a third-party runtime dependency
        shell: python
        run: |
          import importlib.metadata as md
          reqs = md.requires("provenance-pool") or []
          runtime = [r for r in reqs if "extra ==" not in r]
          assert not runtime, f"runtime dependencies appeared: {runtime}"
          print("zero runtime dependencies, as declared")
      - run: python -m pytest tests/ -q
