# The SP1 guest: the pairwise-energy kernel inside the zkVM, carrying the
# guest-input-commitment convention. Built with the `succinct` toolchain
# for riscv64im-succinct-zkvm-elf; NOT a member of any workspace (its
# dependency tree targets RISC-V).
[package]
name = "ste-guest-pairwise"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
sp1-zkvm = { path = "../../../notationsystems/SP1-zero-knowledge-virtual-machine/crates/zkvm/entrypoint" }
execution-kernel = { path = "../../crates/execution-kernel" }
execution-commitment = { path = "../../crates/execution-commitment" }
execution-model = { path = "../../crates/execution-model" }

[workspace]

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
