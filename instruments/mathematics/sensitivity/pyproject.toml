[project]
name = "jacobian-sensitivity-propagation-testbed"
version = "0.1.0"
description = "A computational testbed for propagating local perturbations through composed scientific models, with derivative verification, coordinate-consistency tests, and explicit numerical limitations."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["numpy>=2.0"]

[project.optional-dependencies]
ad = ["jax>=0.4"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sensitivity"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: full-size remainder or Monte Carlo runs; select with -m slow"]
addopts = "-q -m 'not slow'"
