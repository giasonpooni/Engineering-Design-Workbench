name: Arrow and Parquet observation interchange
on:
  pull_request:
    paths:
      - 'src/ciw/columnar*.py'
      - 'src/ciw/net.py'
      - 'tests/test_columnar_optional.py'
      - 'qualification/test_columnar_interchange.py'
      - 'docs/COLUMNAR_INTERCHANGE.md'
      - '.github/workflows/columnar-interchange.yml'
      - 'pyproject.toml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  columnar:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,columnar]' build
      - name: Optional-import and actual Arrow/Parquet round-trip tests
        run: python -m pytest -q tests/test_columnar_optional.py qualification/test_columnar_interchange.py --junitxml=columnar-tests.xml
      - name: Require complete qualification
        shell: bash
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as E
          suites=list(E.parse('columnar-tests.xml').getroot().iter('testsuite'))
          assert sum(int(s.attrib['tests']) for s in suites) >= 10
          assert all(int(s.attrib[k]) == 0 for s in suites for k in ('failures','errors','skipped'))
          PY
          git diff --check
      - run: python -m build --wheel
      - name: Installed wheel remains lazy until columnar operation
        shell: bash
        run: |
          python - <<'PY'
          import os,pathlib,subprocess,sys,tempfile
          wheel=next(pathlib.Path('dist').glob('*.whl')).resolve()
          subprocess.run([sys.executable,'-m','pip','install','--force-reinstall','--no-deps',str(wheel)],check=True)
          with tempfile.TemporaryDirectory() as tmp:
              env={k:v for k,v in os.environ.items() if k!='PYTHONPATH'}
              subprocess.run([sys.executable,'-c','import ciw.columnar,sys; assert "pyarrow" not in sys.modules'],
                             cwd=tmp,env=env,check=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: columnar-interchange-${{ matrix.os }}
          if-no-files-found: error
          path: |
            columnar-tests.xml
            dist/*.whl
