name: Polymer processing instrument

on:
  pull_request:
    paths:
      - 'src/ciw/polymer_*.py'
      - 'src/ciw/net.py'
      - 'src/ciw/agent_mcp.py'
      - 'src/ciw/session.py'
      - 'src/ciw/operations/**'
      - 'tests/test_polymer_*.py'
      - 'examples/polymer/**'
      - 'docs/POLYMER*.md'
      - 'pyproject.toml'
      - '.github/workflows/polymer-processing.yml'
  push:
    branches: [main]
    paths:
      - 'src/ciw/polymer_*.py'
      - 'src/ciw/net.py'
      - 'src/ciw/agent_mcp.py'
      - 'src/ciw/session.py'
      - 'src/ciw/operations/**'
      - 'tests/test_polymer_*.py'
      - 'examples/polymer/**'
      - 'pyproject.toml'
      - '.github/workflows/polymer-processing.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference-and-retention:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install '.[dev]'
      - name: Numerical, refusal and retained identity checks
        run: python -m pytest -q tests/test_polymer_*.py tests/test_protocol.py tests/test_operation_runner.py tests/test_operation_failure_retention.py tests/test_agent_protocol.py tests/test_control_plane.py
      - name: Installed CLI injection example
        run: |
          net polymer example --output "$RUNNER_TEMP/injection.json"
          net polymer run "$RUNNER_TEMP/injection.json" --output-dir "$RUNNER_TEMP/injection" --summary
          net polymer inspect "$RUNNER_TEMP/injection" --summary
          net polymer verify "$RUNNER_TEMP/injection" --output "$RUNNER_TEMP/injection-audit.json"
          net polymer replay "$RUNNER_TEMP/injection" --output-dir "$RUNNER_TEMP/injection-replay" --summary
      - name: Installed CLI blow molding example
        run: |
          net polymer example --process extrusion_blow_molding --output "$RUNNER_TEMP/blow.json"
          net polymer run "$RUNNER_TEMP/blow.json" --output-dir "$RUNNER_TEMP/blow" --summary
          net polymer verify "$RUNNER_TEMP/blow"
      - name: Complete installed operator and agent qualification
        run: |
          net polymer prepare-ingress examples/polymer/native-dimension.template.json --bundle examples/polymer/native-dimension.bundle.json --sensor-id sensor:level --quantity part_dimension --modality vision_3d --max-age-s 2 --output "$RUNNER_TEMP/native-ingress.json"
          net polymer qualify --ingress "$RUNNER_TEMP/native-ingress.json" --output-dir "$RUNNER_TEMP/polymer-qualification"
