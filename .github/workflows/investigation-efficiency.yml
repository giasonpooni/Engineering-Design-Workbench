name: Investigation efficiency contracts
on:
  pull_request:
    paths:
      - 'src/ciw/investigation_efficiency.py'
      - 'src/ciw/efficiency_cli.py'
      - 'src/ciw/control_contracts.py'
      - 'src/ciw/net.py'
      - 'tests/test_investigation_efficiency.py'
      - 'docs/INVESTIGATION_EFFICIENCY.md'
      - '.github/workflows/investigation-efficiency.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  efficiency:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]' build
      - run: python -m pytest -q tests/test_investigation_efficiency.py tests/test_annotations.py tests/test_annotation_nise.py --junitxml=efficiency-tests.xml
      - name: Require complete qualification
        shell: bash
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as E
          suites=list(E.parse('efficiency-tests.xml').getroot().iter('testsuite'))
          assert sum(int(s.attrib['tests']) for s in suites) >= 25
          assert all(int(s.attrib[k]) == 0 for s in suites for k in ('failures','errors','skipped'))
          PY
          git diff --check
      - run: python -m build --wheel
