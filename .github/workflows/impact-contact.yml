name: Impact contact benchmark
on:
  pull_request:
    paths:
      - 'src/ciw/impact_*.py'
      - 'src/ciw/net.py'
      - 'src/ciw/operations/**'
      - 'src/ciw/session.py'
      - 'tests/test_impact*.py'
      - 'docs/IMPACT_CONTACT_BENCHMARK.md'
      - 'examples/impact-contact/**'
      - '.github/workflows/impact-contact.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: impact-contact-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualification:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]' build
      - name: Impact and existing substrate regressions
        run: python -m pytest -q tests/test_impact_core.py tests/test_impact_workflow.py tests/test_impact_preservation.py tests/test_operation_runner.py tests/test_operation_failure_retention.py tests/test_operation_publication.py tests/test_preservation_contracts.py tests/test_finite_preservation.py tests/test_board_morphisms.py tests/test_representation_morphisms.py tests/test_control_plane.py tests/test_semantic_capabilities.py --junitxml=impact-tests.xml
      - name: Require complete qualification
        shell: bash
        run: |
          python - <<'PYTHON'
          import json, platform, subprocess, sys
          import xml.etree.ElementTree as E
          from pathlib import Path
          import numpy
          suites = list(E.parse('impact-tests.xml').getroot().iter('testsuite'))
          count = sum(int(s.attrib['tests']) for s in suites)
          assert count >= 150
          assert all(int(s.attrib[k]) == 0 for s in suites for k in ('failures', 'errors', 'skipped'))
          report = {'source_commit': subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(),
                    'python': sys.version, 'platform': platform.platform(), 'numpy': numpy.__version__,
                    'tests': count, 'failures': 0, 'errors': 0, 'skipped': 0}
          Path('impact-qualification.json').write_text(json.dumps(report, indent=2), encoding='utf-8')
          PYTHON
          python scripts/check_ci_policy.py
          git diff --check
      - run: python -m build --wheel
      - name: Exercise installed commands outside checkout
        shell: bash
        run: |
          python -m venv installed-check
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            IMPACT_PYTHON="$PWD/installed-check/Scripts/python.exe"
          else
            IMPACT_PYTHON="$PWD/installed-check/bin/python"
          fi
          "$IMPACT_PYTHON" -m pip install dist/*.whl
          mkdir installed-smoke
          cd installed-smoke
          "$IMPACT_PYTHON" -m ciw.net impact example --output request.json
          "$IMPACT_PYTHON" -m ciw.net impact run request.json --output-dir run
          "$IMPACT_PYTHON" -m ciw.net impact verify run
          "$IMPACT_PYTHON" -m ciw.net impact export run --output observations.csv
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: impact-contact-${{ matrix.os }}
          path: |
            impact-tests.xml
            impact-qualification.json
            installed-smoke/**
            dist/*.whl
          if-no-files-found: error
          retention-days: 14
