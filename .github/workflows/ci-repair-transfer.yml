name: Retain tested CI repair objects
on:
  push:
    branches: [fix/inbox-ci-repair]
    paths: [.github/workflows/ci-repair-transfer.yml]
permissions:
  contents: write
concurrency:
  group: ci-repair-object-transfer-${{ github.ref }}
  cancel-in-progress: true
jobs:
  retain-objects:
    if: github.ref == 'refs/heads/fix/inbox-ci-repair'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 4
          persist-credentials: false
      - name: Reconstruct the exact already-tested tree, not a new implementation
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply_ci_recovery.py
          rm scripts/apply_ci_recovery.py .github/workflows/ci-repair-build.yml .github/workflows/ci-repair-transfer.yml
          git add -u
          test "$(git write-tree)" = 12360b6581ddb8c3af6dd4d2993672b8f35a36b8
          git diff --cached --check
          mkdir -p "$RUNNER_TEMP/tested-ci-objects"
          git archive --format=tar.gz 12360b6581ddb8c3af6dd4d2993672b8f35a36b8 > "$RUNNER_TEMP/tested-ci-objects/tested-source.tar.gz"
      - name: Retain data blobs only; no branch, commit, workflow or permission update
        env:
          OBJECT_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request
          base = 'd241242a06f26550a43701f44323b2c1d7ad6981'
          tree = subprocess.check_output(['git','write-tree'], text=True).strip()
          assert tree == '12360b6581ddb8c3af6dd4d2993672b8f35a36b8'
          token = os.environ.pop('OBJECT_TOKEN')
          entries = []
          changes = subprocess.check_output(['git','diff','--cached','--name-status',base], text=True).splitlines()
          for change in changes:
              status, path = change.split('\t')
              if status == 'D':
                  entries.append({'path':path, 'mode':'100644', 'type':'blob', 'sha':None})
                  continue
              assert status in ('A','M'), status
              raw = subprocess.check_output(['git','show',':'+path])
              expected = hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
              payload = json.dumps({'encoding':'base64','content':base64.b64encode(raw).decode()}).encode()
              request = urllib.request.Request('https://api.github.com/repos/giasonpooni/Notations-Design-Terminal/git/blobs',data=payload,method='POST',headers={'Authorization':'Bearer '+token,'Content-Type':'application/json','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(request,timeout=30) as response:
                  value = json.load(response)
              assert value['sha'] == expected, path
              entries.append({'path':path,'mode':'100644','type':'blob','sha':expected})
          assert len(entries)==29,len(entries)
          report={'base':base,'tree':tree,'entries':entries,'branch_updates':False,'qualification_run':36354655909,'private_provider_qualification':'not_performed'}
          output=pathlib.Path(os.environ['RUNNER_TEMP'])/'tested-ci-objects'
          (output/'objects.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: tested-ci-repair-objects
          path: ${{ runner.temp }}/tested-ci-objects
          retention-days: 7
          if-no-files-found: error
