name: Oscillator representation reduction experiment
on:
  pull_request:
    paths:
      - 'experiments/oscillator_reduction.py'
      - 'experiments/OSCILLATOR_REDUCTION.md'
      - '.github/workflows/oscillator-reduction.yml'
      - 'src/ciw/investigation_efficiency.py'
      - 'src/ciw/nise_handoff.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  experiment:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: giasonpooni/Notations-Inference-Schematics-Engine
          ref: 42d1239d1be7cd515c5a57cbc4b98a2d31722051
          path: external/nise
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pip install ./external/nise
      - name: Execute same-task full-vs-NISE-reduced experiment
        run: python experiments/oscillator_reduction.py --output-dir oscillator-reduction-evidence > oscillator-reduction-summary.stdout.json
      - name: Require preservation and deterministic operation reduction
        shell: bash
        run: |
          python - <<'PY'
          import json
          result=json.load(open('oscillator-reduction-evidence/summary.json'))
          assert result['required_outputs_identical'] is True
          assert result['required_contracts_identical'] is True
          assert result['source_evidence_identical'] is True
          assert result['provider_runtime_identical'] is True
          assert result['baseline_graph_nodes']==8
          assert result['candidate_graph_nodes']==2
          assert result['operation_call_ratio_candidate_over_baseline']==0.25
          assert result['representation_fraction_candidate'] < 1
          assert result['claims']['general_scientific_equivalence'] is False
          assert result['claims']['multi_scale_precision_hypothesis_tested'] is False
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: oscillator-representation-reduction-${{ matrix.os }}
          if-no-files-found: error
          path: |
            oscillator-reduction-evidence/
            oscillator-reduction-summary.stdout.json
