name: Game trace workbench qualification
on:
  pull_request:
    paths:
      - 'src/ciw/game_*.py'
      - 'src/ciw/control_*.py'
      - 'src/ciw/interactive_simulation.py'
      - 'src/ciw/session.py'
      - 'src/ciw/core/**'
      - 'src/ciw/operations/**'
      - 'tools/game-development/**'
      - 'tests/test_game_*.py'
      - 'scripts/check_game_development.py'
      - '.github/workflows/game-development.yml'
      - 'pyproject.toml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]' build
      - name: New contracts and existing controls/projectile Session regressions
        run: python -m pytest -q tests/test_game_trace.py tests/test_game_session.py tests/test_game_retention.py tests/test_control_plane.py tests/test_interactive_contract.py tests/test_interactive_session.py -o addopts= --junitxml=game-tests.xml
      - name: Require nonempty, unskipped qualification
        shell: bash
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          suites = list(ET.parse('game-tests.xml').getroot().iter('testsuite'))
          assert sum(int(s.attrib['tests']) for s in suites) >= 200
          assert all(int(s.attrib[k]) == 0 for s in suites for k in ('failures', 'errors', 'skipped'))
          PY
          git diff --check
      - run: python -m build --wheel
      - name: Installed wheel tests outside checkout
        shell: bash
        run: |
          python - <<'PY'
          import os, pathlib, shutil, subprocess, sys, tempfile
          wheel = next(pathlib.Path('dist').glob('*.whl')).resolve()
          subprocess.run([sys.executable, '-m', 'pip', 'install', '--force-reinstall', '--no-deps', str(wheel)], check=True)
          with tempfile.TemporaryDirectory() as tmp:
              root = pathlib.Path(tmp)
              for name in ('test_game_trace.py', 'test_game_session.py', 'test_game_retention.py'):
                  shutil.copy2(pathlib.Path('tests') / name, root / name)
              env = {k:v for k,v in os.environ.items() if k != 'PYTHONPATH'}
              subprocess.run([sys.executable, '-m', 'pytest', '-q', str(root), '-o', 'addopts=', '--junitxml=' + str(pathlib.Path('game-installed.xml').resolve())], cwd=root, env=env, check=True)
              subprocess.run([sys.executable, '-m', 'ciw.game_workflow', 'catalog'], cwd=root, env=env, check=True)
              subprocess.run([sys.executable, '-m', 'ciw.game_workflow', 'example', '--output', str(root/'scenario.json')], cwd=root, env=env, check=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: game-contracts-${{ matrix.os }}
          if-no-files-found: error
          path: |
            game-tests.xml
            game-installed.xml
            dist/*.whl
  native:
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exact previously used Godot release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/game-tools"
          cd "$RUNNER_TEMP/game-tools"
          curl --fail --location --retry 2 -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.5.2-stable/Godot_v4.5.2-stable_linux.x86_64.zip
          echo '87f6e6be292929e363d15ed9052f277b2ba4e95ed994e1e099048097be2dfd03  godot.zip' | sha256sum --check
          unzip -q godot.zip
          chmod +x Godot_v4.5.2-stable_linux.x86_64
      - name: Build and install candidate wheel
        run: |
          python -m pip install build
          python -m build --wheel
          python -m pip install dist/*.whl
      - name: Actual native captures, bug detection, correction, reproduction and refusals
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          env -u PYTHONPATH python "$GITHUB_WORKSPACE/scripts/check_game_development.py" \
            --godot "$RUNNER_TEMP/game-tools/Godot_v4.5.2-stable_linux.x86_64" \
            --adapter-root "$GITHUB_WORKSPACE/tools/game-development/godot" \
            --output-dir "$GITHUB_WORKSPACE/results/game-native"
      - name: Retain exact public qualification source
        run: git archive --format=zip --output=game-source.zip HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: game-native-evidence
          if-no-files-found: error
          path: |
            results/game-native
            game-source.zip
            dist/*.whl
