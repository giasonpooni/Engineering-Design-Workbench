name: Integrated workload contracts
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install ".[dev]"
      - name: Test coexistence, original contracts and local-source refusal paths
        run: >-
          python -m pytest -q
          tests/test_interactive_contract.py tests/test_interactive_session.py
          tests/test_interactive_binding_root.py tests/test_simulation_coexistence.py
          tests/test_persistent_inputs.py tests/test_persistent_pipe.py tests/test_persistent_simulation.py
          tests/test_polyglot_linear_map.py tests/test_polyglot_uncertainty.py
          tests/test_fsrt_view.py tests/test_local_provider_sources.py
          --junitxml=integrated-contracts.xml
      - name: Require executed tests; labelled doubles are not native qualification
        shell: python
        run: |
          import xml.etree.ElementTree as E
          cases=list(E.parse('integrated-contracts.xml').getroot().iter('testcase'))
          assert len(cases)>=169, 'Expected combined test coverage is missing'
          assert not any(c.find(t) is not None for c in cases for t in ('skipped','failure','error'))
          print('Contract cases:',len(cases),'; real scientific/native qualification is a separate gate')
      - run: python -m pip wheel --no-deps . --wheel-dir dist-integrated
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: integrated-contracts-${{ matrix.os }}
          path: |
            integrated-contracts.xml
            dist-integrated/*.whl
          if-no-files-found: error
  public-source-inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Record public-source reachability without private credentials or execution
        env:
          INVENTORY_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, runpy, urllib.request, urllib.error
          from pathlib import Path
          names=sorted(runpy.run_path('scripts/ci_provider_access.py',run_name='source_inventory')['PROVIDERS'])
          rows=[]
          for name in names:
              req=urllib.request.Request('https://api.github.com/repos/giasonpooni/'+name,headers={'Authorization':'Bearer '+os.environ['INVENTORY_TOKEN'],'Accept':'application/vnd.github+json'})
              try:
                  with urllib.request.urlopen(req,timeout=15) as stream: value=json.load(stream)
                  rows.append({'requested_repository':'giasonpooni/'+name,'resolved_repository':value['full_name'],'public':not value['private'],'status':'metadata_read_only'})
              except urllib.error.HTTPError as exc:
                  rows.append({'requested_repository':'giasonpooni/'+name,'public':None,'http_status':exc.code,'status':'unresolved_not_qualified'})
          Path('public-source-inventory.json').write_text(json.dumps({'claim':'metadata reachability only; no numerical gate executed or waived','sources':rows},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-source-inventory
          path: public-source-inventory.json
          if-no-files-found: error
