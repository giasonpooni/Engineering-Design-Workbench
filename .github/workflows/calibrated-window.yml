name: Shared calibrated window replay

on:
  push:
    branches: [main]
    tags: ['**']
    paths-ignore:
      - 'README.md'
      - 'docs/**/*.md'
      - 'deploy/**/*.md'
      - 'godot/**/*.md'
      - 'examples/**/README.md'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'docs/**/*.md'
      - 'deploy/**/*.md'
      - 'godot/**/*.md'
      - 'examples/**/README.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  calibrated-window:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install 'setuptools>=77' wheel
      - name: Exercise isolated installed workbench and pinned native providers
        run: python scripts/check_calibrated_window.py --output-dir results/calibrated-window
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: calibrated-window-${{ matrix.python }}
          path: results/calibrated-window
