name: System Board visual editor
on:
  pull_request:
    paths:
      - 'src/ciw/board_visual.py'
      - 'src/ciw/board_cli.py'
      - 'src/ciw/system_board.py'
      - 'src/ciw/web/system_board*.html'
      - 'src/ciw/web/system_board*.css'
      - 'src/ciw/web/system_board*.js'
      - 'tests/test_board_visual.py'
      - 'tests/test_system_board.py'
      - 'tests/test_parameter_program.py'
      - 'docs/SYSTEM_BOARD.md'
      - 'docs/SYSTEM_BOARD_VISUAL.md'
      - '.github/workflows/system-board-visual.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  board-visual:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]' build
      - run: python -m pytest -q tests/test_board_visual.py tests/test_system_board.py tests/test_parameter_program.py --junitxml=board-visual-tests.xml
      - name: Require complete qualification
        shell: bash
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as E
          suites=list(E.parse('board-visual-tests.xml').getroot().iter('testsuite'))
          assert sum(int(s.attrib['tests']) for s in suites) >= 25
          assert all(int(s.attrib[k]) == 0 for s in suites for k in ('failures','errors','skipped'))
          PY
          git diff --check
      - run: python -m build --wheel
