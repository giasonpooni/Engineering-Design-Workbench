name: Atmospheric engine
on:
  pull_request:
    paths:
      - 'src/ciw/atmosphere_*.py'
      - 'src/ciw/net.py'
      - 'src/ciw/operations/**'
      - 'src/ciw/session.py'
      - 'src/ciw/control_contracts.py'
      - 'src/ciw/core/**'
      - 'pyproject.toml'
      - 'tests/test_atmosphere*.py'
      - 'scripts/check_atmosphere_installed.py'
      - 'scripts/check_atmosphere_reference_installed.py'
      - 'docs/ATMOSPHERIC_ENGINE.md'
      - 'docs/ATMOSPHERIC_MOIST_AIR.md'
      - 'docs/ATMOSPHERIC_REFERENCE_VALIDATION.md'
      - 'examples/atmosphere/**'
      - 'examples/atmosphere-moist/**'
      - 'examples/atmosphere-reference/**'
      - '.github/workflows/atmosphere-engine.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: atmosphere-engine-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualification:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]' build
      - name: Atmospheric engine and shared substrate
        run: python -m pytest -q tests/test_atmosphere_core.py tests/test_atmosphere_verification.py tests/test_atmosphere_workflow.py tests/test_atmosphere_preservation.py tests/test_atmosphere_handoff.py tests/test_atmosphere_integration_audit.py tests/test_atmosphere_moist_core.py tests/test_atmosphere_moist_verification.py tests/test_atmosphere_moist_workflow.py tests/test_atmosphere_moist_preservation.py tests/test_atmosphere_moist_handoff.py tests/test_atmosphere_moist_integration_audit.py tests/test_atmosphere_comparison_core.py tests/test_atmosphere_comparison_verification.py tests/test_atmosphere_comparison_workflow.py tests/test_atmosphere_comparison_integration_audit.py tests/test_atmosphere_reference_benchmark.py tests/test_operation_runner.py tests/test_operation_failure_retention.py tests/test_operation_publication.py tests/test_preservation_contracts.py tests/test_finite_preservation.py tests/test_control_plane.py tests/test_semantic_capabilities.py --junitxml=atmosphere-tests.xml
      - name: Require complete qualification
        shell: bash
        run: |
          python - <<'PYTHON'
          import json, platform, subprocess, sys
          import xml.etree.ElementTree as E
          from pathlib import Path
          suites = list(E.parse('atmosphere-tests.xml').getroot().iter('testsuite'))
          count = sum(int(s.attrib['tests']) for s in suites)
          assert count >= 1404
          assert all(int(s.attrib[k]) == 0 for s in suites for k in ('failures', 'errors', 'skipped'))
          report = {'source_commit': subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(),
                    'python': sys.version, 'platform': platform.platform(),
                    'tests': count, 'failures': 0, 'errors': 0, 'skipped': 0}
          Path('atmosphere-qualification.json').write_text(json.dumps(report, indent=2), encoding='utf-8')
          PYTHON
          python scripts/check_ci_policy.py
          git diff --check
      - run: python -m build --wheel
      - name: Installed CLI and retained handoffs
        shell: bash
        run: |
          python -m venv installed-atmosphere
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            ATMOSPHERE_PYTHON="$PWD/installed-atmosphere/Scripts/python.exe"
            ATMOSPHERE_NET="$PWD/installed-atmosphere/Scripts/net.exe"
          else
            ATMOSPHERE_PYTHON="$PWD/installed-atmosphere/bin/python"
            ATMOSPHERE_NET="$PWD/installed-atmosphere/bin/net"
          fi
          "$ATMOSPHERE_PYTHON" -m pip install dist/*.whl
          "$ATMOSPHERE_PYTHON" scripts/check_atmosphere_installed.py --net "$ATMOSPHERE_NET" --output-dir installed-atmosphere-smoke
          "$ATMOSPHERE_PYTHON" scripts/check_atmosphere_reference_installed.py --net "$ATMOSPHERE_NET" --output-dir installed-atmosphere-reference-smoke
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: atmosphere-engine-${{ matrix.os }}-python-${{ matrix.python }}
          path: |
            atmosphere-tests.xml
            atmosphere-qualification.json
            installed-atmosphere-smoke/**
            installed-atmosphere-reference-smoke/**
            dist/*.whl
          if-no-files-found: error
          retention-days: 14
