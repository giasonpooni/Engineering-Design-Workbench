name: Agro-food cold-chain thermal transfer
on:
  pull_request:
    paths:
      - 'experiments/agrofood_cold_chain.py'
      - 'experiments/AGROFOOD_COLD_CHAIN.md'
      - '.github/workflows/agrofood-cold-chain.yml'
      - 'src/ciw/thermal_contract.py'
      - 'src/ciw/thermal_reference.py'
      - 'src/ciw/thermal_workflow.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cold-chain:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Execute synthetic cold-chain transfer workload
        run: python experiments/agrofood_cold_chain.py --output-dir cold-chain-evidence > cold-chain-summary.stdout.json
      - name: Require bounded transfer claims
        shell: bash
        run: |
          python - <<'PY'
          import json
          result=json.load(open('cold-chain-evidence/summary.json'))
          assert result['application']['domain']=='agro-food'
          assert result['observations']['explicit_dropouts']==2
          assert result['sensor_selection']['selected_mask'] is not None
          assert result['sensor_selection']['objective_nats'] >= 0
          assert result['transfer_claim']['existing_thermal_instrument_reused_unchanged'] is True
          assert result['transfer_claim']['new_agriculture_architecture_introduced'] is False
          assert result['transfer_claim']['physical_validation'] is False
          assert result['transfer_claim']['product_quality_prediction'] is False
          assert result['transfer_claim']['state_admission'] is False
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: agrofood-cold-chain-${{ matrix.os }}
          if-no-files-found: error
          path: |
            cold-chain-evidence/
            cold-chain-summary.stdout.json
