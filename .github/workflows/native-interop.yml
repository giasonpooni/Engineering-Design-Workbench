name: Native interoperability integration

on:
  workflow_dispatch:
    inputs:
      require_all:
        description: Require every interoperability gate, including the separate SP1 and sanitizer gates
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  linux-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: ${{ runner.temp }}/scr-native-target
      JULIA_DEPOT_PATH: ${{ runner.temp }}/julia-depot
      JULIA_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve the reviewed SCR source pin
        id: pin
        run: |
          python - <<'PY'
          import json, os
          pin=json.load(open('src/ciw/native-interop-runtimes.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              print('revision='+pin['scr_revisions'][-1],file=out)
          PY
      - name: Require operator-provisioned access to the private owner repository
        env:
          SCR_READ_TOKEN: ${{ secrets.SCR_READ_TOKEN }}
        run: test -n "$SCR_READ_TOKEN"
      - uses: actions/checkout@v4
        with:
          repository: giasonpooni/Scientific-Computation-Runtime
          ref: ${{ steps.pin.outputs.revision }}
          path: .ciw-scr-provider
          token: ${{ secrets.SCR_READ_TOKEN }}
          persist-credentials: false
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10.12'
      - name: Provision toolchains and package environments before requests
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
          cargo build --locked --manifest-path .ciw-scr-provider/crates/execution-provider-host/Cargo.toml
          julia --startup-file=no --project=runtimes/julia-oscillator -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'
          julia --startup-file=no --project=runtimes/native-interop -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'
          python -m pip install build pytest
          python -m build --wheel
          python -m venv "$RUNNER_TEMP/installed-ciw"
          "$RUNNER_TEMP/installed-ciw/bin/python" -m pip install dist/*.whl
      - name: Require genuine legacy and native Julia worker checks
        env:
          CIW_TEST_JULIA_DEPOT: ${{ runner.temp }}/julia-depot
        run: |
          export CIW_TEST_JULIA="$(command -v julia)"
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/test_julia_oscillator.py tests/test_julia_worker_native.py --junitxml="$RUNNER_TEMP/julia-tests.xml"
          python - <<'PY'
          import os, xml.etree.ElementTree as E
          root=E.parse(os.path.join(os.environ['RUNNER_TEMP'],'julia-tests.xml'))
          assert not root.findall('.//skipped'), 'Required Julia gate skipped tests'
          PY
      - name: Bind exact installed runtimes
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,shutil
          root=pathlib.Path.cwd()
          host=pathlib.Path(os.environ['CARGO_TARGET_DIR'])/'debug/scr-provider-host'
          binding={'scr':str(root/'.ciw-scr-provider'),'host':str(host),
              'host_sha256':'sha256:'+hashlib.sha256(host.read_bytes()).hexdigest(),
              'julia':shutil.which('julia'),'julia_runtime':str(root),'julia_depot':os.environ['JULIA_DEPOT_PATH']}
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'native-binding.json').write_text(json.dumps(binding))
          PY
      - name: Installed wheel, provider-free reopen and explicit replay
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/installed-ciw/bin/python" -I "$GITHUB_WORKSPACE/scripts/check_installed.py"
          "$RUNNER_TEMP/installed-ciw/bin/python" -I "$GITHUB_WORKSPACE/scripts/check_native_interop.py" --run --binding "$RUNNER_TEMP/native-binding.json" --fixtures "$GITHUB_WORKSPACE/examples/native-interop/reference_fixtures.json" --output "$RUNNER_TEMP/native-results"
      - name: Full integration cannot pass with missing proof or sanitizer evidence
        if: ${{ inputs.require_all }}
        run: |
          python - <<'PY'
          import json,os
          report=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'native-results/report.json')))
          assert report['full_completion'], 'Full interoperability remains incomplete; inspect separate gate outcomes'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-interoperability-evidence
          path: |
            ${{ runner.temp }}/native-results
            ${{ runner.temp }}/julia-tests.xml
