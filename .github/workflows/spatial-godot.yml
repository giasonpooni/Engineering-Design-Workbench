name: Retained spatial Godot consumer
on:
  pull_request:
    paths:
      - 'src/ciw/spatial_*.py'
      - 'src/ciw/viewer_assets/spatial/**'
      - 'src/ciw/provider_catalog.py'
      - 'tests/test_spatial*.py'
      - 'scripts/check_spatial_godot_installed.py'
      - 'pyproject.toml'
      - '.github/workflows/spatial-godot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  godot-spatial:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GSC_REVISION: acc6a4c43dd1d28e3fc6890dadf5cd2b4ae40125
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: giasonpooni/Geospatial-Systems-Compiler
          ref: ${{ env.GSC_REVISION }}
          path: .ciw-gsc-source
          persist-credentials: false
      - name: Explicit dependency provisioning
        run: |
          python -m pip install -e '.[dev,openusd]' build
          python -m pip install -r .ciw-gsc-source/tools/ciw-local-frame/requirements.txt
          curl --fail --location --retry 3 'https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.5.2' --output "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.5.2-stable_linux.x86_64"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v4.5.2-stable_linux.x86_64" >> "$GITHUB_ENV"
          echo "GODOT_SHA256=sha256:$(sha256sum "$RUNNER_TEMP/godot/Godot_v4.5.2-stable_linux.x86_64" | cut -d' ' -f1)" >> "$GITHUB_ENV"
          command -v xvfb-run
      - name: Contracts with actual GSC and OpenUSD dependencies
        run: |
          GSC_LOCAL_FRAME_ROOT="$GITHUB_WORKSPACE/.ciw-gsc-source" python -m pytest tests/test_spatial_provider.py tests/test_spatial_godot.py -q --junitxml=consumer-tests.xml
          python - <<'PY'
          import xml.etree.ElementTree as E
          suites=list(E.parse('consumer-tests.xml').getroot().iter('testsuite'))
          assert sum(int(s.attrib['tests']) for s in suites) == 72
          assert all(int(s.attrib[k]) == 0 for s in suites for k in ('failures','errors','skipped'))
          PY
          python -m pytest tests/test_workbench_session.py tests/test_operation_runner.py tests/test_operation_failure_retention.py tests/test_operation_publication.py tests/test_usda_export.py tests/test_usd_export.py tests/test_json_numeric_boundary.py tests/test_cli_json_boundary.py -q --junitxml=consumer-regressions.xml
      - name: Build and install wheel with packaged viewer assets
        run: |
          python -m build --wheel
          python -m pip install --force-reinstall --no-deps dist/*.whl
      - name: Actual engine import, selection, refusal and rendered captures
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          cd "$RUNNER_TEMP"
          xvfb-run -a python -I "$GITHUB_WORKSPACE/scripts/check_spatial_godot_installed.py" --gsc-root "$GITHUB_WORKSPACE/.ciw-gsc-source" --gsc-revision "$GSC_REVISION" --godot "$GODOT" --godot-sha256 "$GODOT_SHA256" --output-dir "$GITHUB_WORKSPACE/consumer-evidence" --render
      - name: Retain exact source and runtime digests
        if: always()
        run: |
          git archive --format=zip --output=consumer-source.zip HEAD
          if test -f "$RUNNER_TEMP/godot.zip"; then sha256sum "$RUNNER_TEMP/godot.zip" > godot-download.sha256; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: net-spatial-godot-linux
          if-no-files-found: error
          path: |
            consumer-tests.xml
            consumer-regressions.xml
            consumer-evidence
            consumer-source.zip
            godot-download.sha256
            dist/*.whl
