name: Unattended local vision-agent workcell
on:
  pull_request:
    paths:
      - 'src/ciw/agent_local_model.py'
      - 'src/ciw/agent_unattended.py'
      - 'tests/test_agent_local_model.py'
      - 'tests/test_agent_unattended.py'
      - 'scripts/check_unattended_agent.py'
      - 'docs/UNATTENDED_AGENT.md'
      - '.github/workflows/net-unattended-agent.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: giasonpooni/1792
          ref: 2e1e66af5bf3fc913224a245a31478463b7b9d93
          path: title
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]' build mcp==1.26.0
      - name: New provider/driver and unchanged inherited contracts
        run: |
          python title/tools/check_smith_workcell.py
          python title/tools/check_project.py
          python -m pytest -q tests/test_agent_local_model.py tests/test_agent_unattended.py tests/test_agent_experiment.py tests/test_agent_transcript.py tests/test_workcell.py tests/test_workcell_snapshot.py tests/test_workcell_smith.py tests/test_foundry_pipeline.py tests/test_foundry.py tests/test_production.py tests/test_game_trace.py tests/test_game_session.py tests/test_game_retention.py tests/test_control_plane.py tests/test_interactive_contract.py tests/test_interactive_session.py tests/test_agent_protocol.py tests/test_computational_objects.py tests/test_computational_source.py --junitxml=unattended-source.xml
      - name: Provision immutable original workcell image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/smith-image" "$RUNNER_TEMP/godot"
          cp tools/workcell-godot/* "$RUNNER_TEMP/smith-image/"
          curl --fail --location --retry 2 --max-time 180 https://github.com/godotengine/godot-builds/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip -o "$RUNNER_TEMP/godot.zip"
          echo "02ec53d1cc7dbb9cc6355393c61b9ab43d1244751a124f10248a4802830788cd  $RUNNER_TEMP/godot.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          cp "$RUNNER_TEMP/godot/Godot_v4.5.1-stable_linux.x86_64" "$RUNNER_TEMP/smith-image/godot"
          docker pull ubuntu:24.04
          BASE=$(docker image inspect ubuntu:24.04 --format '{{index .RepoDigests 0}}')
          echo "$BASE" > unattended-base.txt
          docker build --build-arg "BASE=$BASE" -t net-smith-qualified "$RUNNER_TEMP/smith-image"
          docker image inspect net-smith-qualified --format '{{.Id}}' > unattended-workcell-image.txt
      - name: Operator provisions one local vision model, then removes inference egress
        shell: bash
        run: |
          set -euo pipefail
          docker pull ollama/ollama:0.12.7
          MODEL_IMAGE=$(docker image inspect ollama/ollama:0.12.7 --format '{{.Id}}')
          echo "$MODEL_IMAGE" > unattended-model-image.txt
          docker volume create net-agent-models
          docker run -d --name net-agent-provision --mount type=volume,source=net-agent-models,target=/models -e OLLAMA_MODELS=/models -e OLLAMA_NO_CLOUD=1 "$MODEL_IMAGE"
          for i in $(seq 1 30); do
            if docker exec net-agent-provision ollama list >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec net-agent-provision ollama list
          timeout 600 docker exec net-agent-provision ollama pull qwen3-vl:2b-instruct
          docker rm -f net-agent-provision
          docker network create --internal net-agent-internal
          docker run -d --name net-agent-model --network net-agent-internal -p 127.0.0.1:11434:11434 \
            --read-only --cap-drop=ALL --security-opt=no-new-privileges --cpus=2 --memory=4g --memory-swap=4g --pids-limit=256 \
            --tmpfs /tmp:rw,size=536870912 --tmpfs /root/.ollama:rw,size=8388608 \
            --mount type=volume,source=net-agent-models,target=/models,readonly \
            -e OLLAMA_MODELS=/models -e OLLAMA_NO_CLOUD=1 -e OLLAMA_NUM_PARALLEL=1 "$MODEL_IMAGE"
          for i in $(seq 1 30); do curl --fail --max-time 2 http://127.0.0.1:11434/api/version && break || sleep 1; done
          curl --fail --max-time 3 http://127.0.0.1:11434/api/version > unattended-model-version.json
          docker inspect net-agent-model > unattended-model-container.json
          docker network inspect net-agent-internal > unattended-model-network.json
      - run: python -m build --wheel
      - name: Installed package and actual unattended model/image/edit/build loop
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --force-reinstall --no-deps dist/*.whl
          export NET_WORKCELL_TEST_ROOT="$GITHUB_WORKSPACE"
          mkdir -p "$GITHUB_WORKSPACE/results"
          cd "$RUNNER_TEMP"
          env -u PYTHONPATH python -c 'import ciw.agent_unattended; assert "site-packages" in ciw.agent_unattended.__file__'
          cp "$GITHUB_WORKSPACE/tests/test_workcell"*.py .
          cp "$GITHUB_WORKSPACE/tests/test_agent_local_model.py" "$GITHUB_WORKSPACE/tests/test_agent_unattended.py" .
          env -u PYTHONPATH python -m pytest -q test_agent_local_model.py test_agent_unattended.py --junitxml="$GITHUB_WORKSPACE/unattended-installed.xml"
          env -u PYTHONPATH python "$GITHUB_WORKSPACE/scripts/check_unattended_agent.py" \
            --endpoint http://127.0.0.1:11434 --model qwen3-vl:2b-instruct --server-version 0.12.7 \
            --title-root "$GITHUB_WORKSPACE/title/game" --source-profile "$GITHUB_WORKSPACE/title/tools/net/smith-workcell.profile.json" \
            --profile-sha256 sha256:afe9f6ef3eec76126d0f56738c5ee762de6eaa8ea58b13dd5ba92b23ecd1ab8f \
            --docker "$(command -v docker)" --image-id "$(cat "$GITHUB_WORKSPACE/unattended-workcell-image.txt")" \
            --output-dir "$GITHUB_WORKSPACE/results/unattended"
      - name: Require complete measured qualification, not creative success
        run: |
          python - <<'PY'
          import json,xml.etree.ElementTree as E
          for path,count in [('unattended-source.xml',726),('unattended-installed.xml',75)]:
              suites=list(E.parse(path).getroot().iter('testsuite'))
              assert sum(int(s.attrib['tests']) for s in suites)>=count
              assert all(int(s.attrib[k])==0 for s in suites for k in ('failures','errors','skipped'))
          report=json.load(open('results/unattended/qualification.json'))
          assert report['status']=='passed' and report['actual_model_responses']>0
          # Refusal/stop/rejection is measured; never require an accepted creative revision.
          PY
          git diff --check
      - name: Retain sources, model status and partial failures; remove only this job's resources
        if: always()
        run: |
          git archive --format=zip --output=unattended-net-source.zip HEAD
          git -C title archive --format=zip --output="$GITHUB_WORKSPACE/unattended-title-source.zip" HEAD
          docker logs net-agent-model > unattended-model-log.txt 2>&1 || true
          docker rm -f net-agent-model net-agent-provision || true
          docker network rm net-agent-internal || true
          docker volume rm net-agent-models || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: unattended-agent-evidence
          if-no-files-found: error
          path: |
            unattended-*.xml
            unattended-*.json
            unattended-*.txt
            unattended-*.zip
            dist/*.whl
            results/unattended
