name: Scientific system composition
on:
  pull_request:
    paths:
      - 'src/ciw/**'
      - 'tests/test_system*.py'
      - 'tests/test_capabilities.py'
      - 'pyproject.toml'
      - '.github/workflows/system-composition.yml'
      - 'containers/system-reference/**'
      - 'scripts/qualify_system_oci.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference-and-wheel:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python -c "import pathlib,subprocess,sys; paths=sorted(str(p) for p in pathlib.Path('tests').glob('test_system*.py'));subprocess.run([sys.executable,'-m','pytest',*paths,'tests/test_capabilities.py','tests/test_protocol.py','tests/test_correction_session.py'],check=True)"
      - run: python -m pip wheel --no-deps . --wheel-dir dist
      - run: python -m pip uninstall -y computational-instrumentation-workbench
      - name: Qualify installed worker and offline inspection
        run: |
          python -c "import pathlib,subprocess,sys; subprocess.run([sys.executable,'-m','pip','install','--no-deps',str(next(pathlib.Path('dist').glob('*.whl')))],check=True)"
          python -c "import os,pathlib,subprocess,sys,tempfile; d=pathlib.Path(tempfile.mkdtemp()); env=dict(os.environ);env.pop('PYTHONPATH',None);subprocess.run([sys.executable,'-m','ciw','system','demo','--output-dir',str(d/'demo')],cwd=d,env=env,check=True);subprocess.run([sys.executable,'-m','ciw','system','inspect',str(d/'demo'/'workspace.json')],cwd=d,env=env,check=True)"
  oci-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - run: python -m pip install --upgrade 'setuptools>=77' wheel
      - run: python -m pip install -e '.[dev]'
      - name: Qualify actual digest-selected OCI worker
        run: python scripts/qualify_system_oci.py --output-dir results/system-oci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scientific-system-oci-qualification
          path: results/system-oci
          if-no-files-found: error
