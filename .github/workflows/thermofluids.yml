name: Thermofluids reference tools
on:
  pull_request:
    paths:
      - 'src/ciw/thermofluids_*.py'
      - 'src/ciw/operator_commands.py'
      - 'src/ciw/control_contracts.py'
      - 'src/ciw/core/identities.py'
      - 'src/ciw/operations/runner.py'
      - 'tests/test_thermofluids*.py'
      - 'scripts/check_thermofluids_installed.py'
      - 'docs/THERMOFLUIDS.md'
      - '.github/workflows/thermofluids.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: thermofluids-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reference-checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Analytic cases, retained identity boundaries and existing models
        run: python -m pytest -q tests/test_thermofluids_models.py tests/test_thermofluids_workflow.py tests/test_operator_catalog.py tests/test_thermal_contract.py tests/test_fluid_reservoir.py tests/test_fluid_wave.py --junitxml=thermofluids-tests.xml
      - run: python -m pip wheel --no-deps . --wheel-dir dist
      - name: Installed package outside source checkout
        shell: bash
        run: |
          python -m venv installed-thermofluids
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            THERMO_PYTHON="$PWD/installed-thermofluids/Scripts/python.exe"
          else
            THERMO_PYTHON="$PWD/installed-thermofluids/bin/python"
          fi
          "$THERMO_PYTHON" -m pip install dist/*.whl
          "$THERMO_PYTHON" scripts/check_thermofluids_installed.py --output-dir installed-thermofluids-smoke
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: thermofluids-${{ matrix.os }}
          path: |
            thermofluids-tests.xml
            installed-thermofluids-smoke/**
          if-no-files-found: error
          retention-days: 14
