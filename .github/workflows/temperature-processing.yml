name: Temperature measurement processing
on:
  pull_request:
    paths:
      - 'src/ciw/temperature_*.py'
      - 'src/ciw/agent_mcp.py'
      - 'src/ciw/operations/schemas.py'
      - 'tests/test_temperature_*.py'
      - 'docs/TEMPERATURE_QUALIFICATION.md'
      - 'examples/temperature/**'
      - '.github/workflows/temperature-processing.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  software-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]' build
      - name: Numerical and MCP contracts plus existing boundary regressions
        run: python -m pytest -q tests/test_temperature_processing.py tests/test_temperature_agent.py tests/test_agent_protocol.py tests/test_polymer_agent.py tests/test_polymer_metrology.py tests/test_control_plane.py tests/test_check_suite.py tests/test_operation_runner.py tests/test_operation_failure_retention.py tests/test_operation_publication.py tests/test_covariance_records.py -o addopts= --junitxml=temperature-contracts.xml
      - run: python -m build --wheel
      - name: Installed wheel tests outside source imports
        shell: bash
        run: |
          python - <<'PY'
          import os,pathlib,subprocess,sys,tempfile
          root=pathlib.Path.cwd()
          wheel=next((root/'dist').glob('*.whl'))
          subprocess.run([sys.executable,'-m','pip','install','--force-reinstall','--no-deps',str(wheel)],check=True)
          env={k:v for k,v in os.environ.items() if k!='PYTHONPATH'}
          with tempfile.TemporaryDirectory() as tmp:
              location=subprocess.check_output([sys.executable,'-I','-c','import ciw.temperature_workflow; print(ciw.temperature_workflow.__file__)'],cwd=tmp,env=env,text=True)
              assert not pathlib.Path(location.strip()).resolve().is_relative_to(root)
              subprocess.run([sys.executable,'-I','-m','pytest','-q',str(root/'tests/test_temperature_processing.py'),str(root/'tests/test_temperature_agent.py'),'-o','pythonpath=','-o','addopts=','--junitxml='+str(root/'temperature-installed.xml')],cwd=tmp,env=env,check=True)
          PY
      - name: Refuse missing tests or skipped qualification
        shell: bash
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          for path in ('temperature-contracts.xml','temperature-installed.xml'):
              suites=list(ET.parse(path).getroot().iter('testsuite'))
              assert suites and sum(int(s.attrib['tests']) for s in suites)>0
              assert all(int(s.attrib[k])==0 for s in suites for k in ('failures','errors','skipped'))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: temperature-software-${{ matrix.os }}
          if-no-files-found: error
          path: |
            temperature-contracts.xml
            temperature-installed.xml
            dist/*.whl
