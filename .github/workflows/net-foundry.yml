name: NET Foundry 1792
on:
  pull_request:
    paths:
      - 'src/ciw/foundry*.py'
      - 'src/ciw/net.py'
      - 'src/ciw/production*.py'
      - 'src/ciw/control_*.py'
      - 'src/ciw/session.py'
      - 'src/ciw/operations/**'
      - 'tests/test_foundry.py'
      - 'scripts/check_foundry.py'
      - '.github/workflows/net-foundry.yml'
      - 'pyproject.toml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]' build
      - name: New Foundry and unchanged production/control/game suites
        run: python -m pytest -q tests/test_foundry.py tests/test_production.py tests/test_game_trace.py tests/test_game_session.py tests/test_game_retention.py tests/test_control_plane.py tests/test_interactive_contract.py tests/test_interactive_session.py -o addopts= --junitxml=foundry-source.xml
      - run: python -m build --wheel
      - name: Installed-wheel Foundry tests outside checkout
        shell: bash
        run: |
          python - <<'PY'
          import os, pathlib, shutil, subprocess, sys, tempfile
          wheel = next(pathlib.Path('dist').glob('*.whl')).resolve()
          subprocess.run([sys.executable, '-m', 'pip', 'install', '--force-reinstall', '--no-deps', str(wheel)], check=True)
          report = pathlib.Path('foundry-wheel.xml').resolve()
          with tempfile.TemporaryDirectory() as tmp:
              root = pathlib.Path(tmp)
              shutil.copy2('tests/test_foundry.py', root/'test_foundry.py')
              env = {k:v for k,v in os.environ.items() if k != 'PYTHONPATH'}
              subprocess.run([sys.executable, '-m', 'pytest', '-q', str(root), '-o', 'addopts=', '--junitxml='+str(report)], cwd=root, env=env, check=True)
          PY
          git diff --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: foundry-contracts-${{ matrix.os }}
          if-no-files-found: error
          path: |
            foundry-source.xml
            foundry-wheel.xml
            dist/*.whl
  native:
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: giasonpooni/1792
          ref: 2bb8a16e63716d54de2d4e97daabc4671d3e07f4
          path: game-source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Bind the existing 1792 Godot 4.5.1 release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/foundry-tools"
          cd "$RUNNER_TEMP/foundry-tools"
          curl --fail --location --retry 2 -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip
          echo '02ec53d1cc7dbb9cc6355393c61b9ab43d1244751a124f10248a4802830788cd  godot.zip' | sha256sum --check
          unzip -q godot.zip
          chmod +x Godot_v4.5.1-stable_linux.x86_64
      - name: Build and install candidate wheel
        run: |
          python -m pip install build
          python -m build --wheel
          python -m pip install dist/*.whl
      - name: Native game production, correction, refusal, hold and artifact export
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          env -u PYTHONPATH python "$GITHUB_WORKSPACE/scripts/check_foundry.py" \
            --godot "$RUNNER_TEMP/foundry-tools/Godot_v4.5.1-stable_linux.x86_64" \
            --game-root "$GITHUB_WORKSPACE/game-source/game" \
            --output-dir "$GITHUB_WORKSPACE/results/foundry-native"
      - name: Retain exact controller and game source
        if: always()
        shell: bash
        run: |
          git archive --format=zip --output=foundry-source.zip HEAD
          git -C game-source archive --format=zip --output="$GITHUB_WORKSPACE/foundry-game-source.zip" HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: foundry-native-evidence
          if-no-files-found: error
          path: |
            results/foundry-native
            foundry-source.zip
            foundry-game-source.zip
            dist/*.whl
