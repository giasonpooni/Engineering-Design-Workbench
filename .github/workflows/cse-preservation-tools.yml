name: CSE preservation and transition tools
on:
  pull_request:
    paths:
      - 'src/ciw/cse_preservation.py'
      - 'src/ciw/bim_interop.py'
      - 'src/ciw/bim_interop_cli.py'
      - 'src/ciw/transition_cli.py'
      - 'tests/test_bim_interop.py'
      - 'docs/BIM_INTEROP_RUNTIME.md'
      - '.github/workflows/cse-preservation-tools.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualification:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]' build
      - name: Clone pinned CSE
        shell: bash
        run: |
          git clone --no-checkout https://github.com/giasonpooni/Construction-State-Estimator-for-BIM.git cse
          git -C cse checkout 4b74abda40bba3277de69bf61e9e09283ae2d5b3
      - name: Bind pinned CSE path
        shell: python
        run: |
          import os
          from pathlib import Path
          path = Path('cse').resolve()
          assert path.is_dir()
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as stream:
              stream.write(f'CIW_CSE_REPO={path}\n')
      - name: Preservation/state/transition tool regressions
        run: python -m pytest -q tests/test_bim_interop.py tests/test_interop_ingress.py tests/test_industrial_transition.py tests/test_preservation_contracts.py tests/test_bim_quantity.py tests/test_board_morphisms.py tests/test_finite_preservation.py tests/test_representation_interventions.py tests/test_representation_morphisms.py --junitxml=cse-preservation-tests.xml
      - name: Require complete qualification
        shell: bash
        run: |
          python - <<'PYTHON'
          import xml.etree.ElementTree as E
          suites=list(E.parse('cse-preservation-tests.xml').getroot().iter('testsuite'))
          count=sum(int(s.attrib['tests']) for s in suites)
          assert count >= 125
          assert all(int(s.attrib[k]) == 0 for s in suites for k in ('failures','errors','skipped'))
          PYTHON
          python scripts/check_ci_policy.py
          git diff --check
      - run: python -m build --wheel
