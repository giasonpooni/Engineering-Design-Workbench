name: Qualified fluid dynamics
on:
  pull_request:
    paths:
      - 'src/ciw/fluid_*.py'
      - 'src/ciw/net.py'
      - 'src/ciw/operations/**'
      - 'src/ciw/session.py'
      - 'tests/test_fluid*.py'
      - 'scripts/check_fluid_installed.py'
      - 'docs/FLUID_DYNAMICS.md'
      - 'examples/fluid-dynamics/**'
      - '.github/workflows/fluid-dynamics.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fluid-dynamics-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualification:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]' build
      - name: Dynamics, independent audit, and retained substrate
        run: python -m pytest -q tests/test_fluid_reservoir.py tests/test_fluid_wave.py tests/test_fluid_workflow.py tests/test_fluid_cli.py tests/test_fluid_handoff.py tests/test_fluid_independent_audit.py tests/test_operation_runner.py tests/test_operation_failure_retention.py tests/test_operation_publication.py tests/test_preservation_contracts.py tests/test_finite_preservation.py tests/test_control_plane.py tests/test_semantic_capabilities.py --junitxml=fluid-tests.xml
      - name: Require complete qualification
        shell: bash
        run: |
          python - <<'PYTHON'
          import json, platform, subprocess, sys
          import xml.etree.ElementTree as E
          from pathlib import Path
          suites = list(E.parse('fluid-tests.xml').getroot().iter('testsuite'))
          count = sum(int(s.attrib['tests']) for s in suites)
          assert count > 0
          assert all(int(s.attrib[k]) == 0 for s in suites for k in ('failures', 'errors', 'skipped'))
          report = {'source_commit': subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(),
                    'source_tree': subprocess.check_output(['git','rev-parse','HEAD^{tree}'], text=True).strip(),
                    'python': sys.version, 'platform': platform.platform(),
                    'tests': count, 'failures': 0, 'errors': 0, 'skipped': 0,
                    'physical_validation': 'not_established', 'state_admission': 'not_performed'}
          Path('fluid-qualification.json').write_text(json.dumps(report, indent=2), encoding='utf-8')
          PYTHON
          python scripts/check_ci_policy.py
          git diff --check
      - run: python -m build --wheel
      - name: Installed CLI outside source checkout
        shell: bash
        run: |
          python -m venv installed-fluid
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            FLUID_PYTHON="$PWD/installed-fluid/Scripts/python.exe"
            FLUID_NET="$PWD/installed-fluid/Scripts/net.exe"
          else
            FLUID_PYTHON="$PWD/installed-fluid/bin/python"
            FLUID_NET="$PWD/installed-fluid/bin/net"
          fi
          "$FLUID_PYTHON" -m pip install dist/*.whl
          "$FLUID_PYTHON" scripts/check_fluid_installed.py --net "$FLUID_NET" --output-dir installed-fluid-smoke
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fluid-dynamics-${{ matrix.os }}
          path: |
            fluid-tests.xml
            fluid-qualification.json
            installed-fluid-smoke/**
            dist/*.whl
          if-no-files-found: error
          retention-days: 14
