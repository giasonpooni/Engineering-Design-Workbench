name: Read-only CI recovery audit
on:
  push:
    branches: [fix/ci-runtime-recovery]
    paths: [.github/workflows/ci-recovery-audit.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ci-recovery-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 033703ad7ee5164fe2d1164f5d2956ee7b8c4dea
          persist-credentials: false
      - name: Retain exact public source for reproduction
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ci-recovery"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/ci-recovery/baseline-source.tar.gz"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/ci-recovery/source-identity.txt"
      - name: Inspect failed workflows without rerunning or changing them
        env:
          READ_TOKEN: ${{ github.token }}
          AUDIT_OUTPUT: ${{ runner.temp }}/ci-recovery
        shell: bash
        run: |
          python - <<'PY'
          import concurrent.futures, hashlib, json, os, pathlib, re, urllib.request, urllib.error
          repo = 'giasonpooni/Notations-Design-Terminal'
          commit = '033703ad7ee5164fe2d1164f5d2956ee7b8c4dea'
          base = 'https://api.github.com/repos/' + repo
          output = pathlib.Path(os.environ['AUDIT_OUTPUT'])
          token = os.environ.pop('READ_TOKEN')
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          def get(path, raw=False):
              request = urllib.request.Request(base + path, headers={
                  'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'notations-read-only-ci-audit'})
              try:
                  response = urllib.request.build_opener(NoRedirect).open(request, timeout=30)
              except urllib.error.HTTPError as exc:
                  if exc.code != 302 or not raw:
                      raise
                  url = exc.headers['Location']
                  if not url.startswith('https://'):
                      raise ValueError('Non-HTTPS log redirect')
                  # Do not forward the GitHub token to the signed log host.
                  response = urllib.request.urlopen(url, timeout=30)
              with response:
                  data = response.read(8*1024*1024 + 1)
              if len(data) > 8*1024*1024:
                  raise ValueError('Audit response exceeded eight MiB')
              return data if raw else json.loads(data)
          runs = get('/actions/runs?head_sha=' + commit + '&per_page=100')
          summary = {'scope': 'read_only_diagnostic_not_qualification', 'repository': repo,
                     'commit': commit, 'total_runs': runs['total_count'], 'runs': [], 'errors': []}
          if len(runs['workflow_runs']) != runs['total_count']:
              summary['errors'].append('Run listing incomplete; pagination required')
          tasks = []
          for run in runs['workflow_runs']:
              row = {key: run[key] for key in ('id','name','path','event','head_branch','head_sha','status','conclusion','html_url')}
              row['jobs'] = []
              jobs = get('/actions/runs/' + str(run['id']) + '/jobs?per_page=100')
              if jobs['total_count'] > len(jobs['jobs']):
                  summary['errors'].append('Incomplete jobs for run ' + str(run['id']))
              for job in jobs['jobs']:
                  item = {key: job[key] for key in ('id','name','status','conclusion','html_url')}
                  item['failed_steps'] = [step['name'] for step in job.get('steps',[]) if step['conclusion'] == 'failure']
                  row['jobs'].append(item)
                  if job['conclusion'] == 'failure' or item['failed_steps']:
                      tasks.append(item)
              summary['runs'].append(row)
          pattern = re.compile(r'error|failed|fatal:|exception|traceback|not found|could not|cannot|assert|no such|permission|refused', re.I)
          def inspect(item):
              try:
                  text = get('/actions/jobs/' + str(item['id']) + '/logs', raw=True).decode('utf-8', 'replace')
                  text = re.sub(r'\x1b\[[0-9;]*m','',text)
                  text = re.sub(r'(?:gh[pousr]_[A-Za-z0-9_]+|github_pat_[A-Za-z0-9_]+)', '[REDACTED]', text)
                  lines = [re.sub(r'^\S+Z\s+', '', line) for line in text.splitlines()]
                  matches = list(dict.fromkeys(line for line in lines if pattern.search(line)))
                  item['failure_excerpts'] = matches[-80:]
                  item['log_sha256'] = hashlib.sha256(text.encode()).hexdigest()
                  item['log_line_count'] = len(lines)
              except Exception as exc:
                  item['inspection_error'] = type(exc).__name__ + ': ' + str(exc)
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:
              list(pool.map(inspect, tasks))
          (output/'triage.json').write_text(json.dumps(summary, indent=2)+'\n')
          for path in sorted(output.iterdir()):
              if path.is_file() and path.name != 'SHA256SUMS':
                  with (output/'SHA256SUMS').open('a') as sums:
                      sums.write(hashlib.sha256(path.read_bytes()).hexdigest()+'  '+path.name+'\n')
          print('Inspected', len(summary['runs']), 'runs;', len(tasks), 'failed/cancelled-with-failure jobs. This is not a test pass.')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ci-recovery-diagnostic
          path: ${{ runner.temp }}/ci-recovery
          if-no-files-found: error
          retention-days: 7
