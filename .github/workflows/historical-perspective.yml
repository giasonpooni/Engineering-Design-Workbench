name: Historical perspective contracts
on:
  pull_request:
    paths:
      - 'src/ciw/historical_perspective.py'
      - 'src/ciw/perspective_workflow.py'
      - 'src/ciw/net.py'
      - 'src/ciw/session.py'
      - 'src/ciw/control_*.py'
      - 'src/ciw/core/**'
      - 'src/ciw/operations/**'
      - 'tests/test_historical_perspective.py'
      - '.github/workflows/historical-perspective.yml'
      - 'pyproject.toml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]' build
      - name: New and unchanged contracts
        run: python -m pytest -q tests/test_historical_perspective.py tests/test_production.py tests/test_game_trace.py tests/test_game_session.py tests/test_game_retention.py tests/test_control_plane.py tests/test_interactive_contract.py tests/test_interactive_session.py -o addopts= --junitxml=perspective-source.xml
      - run: python -m build --wheel
      - name: Installed package outside source checkout
        shell: bash
        run: |
          python - <<'PY'
          import os, pathlib, shutil, subprocess, sys, tempfile
          import xml.etree.ElementTree as ET
          suites = list(ET.parse('perspective-source.xml').getroot().iter('testsuite'))
          assert sum(int(s.attrib['tests']) for s in suites) >= 338
          assert all(int(s.attrib[k]) == 0 for s in suites for k in ('failures', 'errors', 'skipped'))
          wheel = next(pathlib.Path('dist').glob('*.whl')).resolve()
          subprocess.run([sys.executable, '-m', 'pip', 'install', '--force-reinstall', '--no-deps', str(wheel)], check=True)
          report = pathlib.Path('perspective-installed.xml').resolve()
          checkout = pathlib.Path.cwd().resolve()
          with tempfile.TemporaryDirectory() as tmp:
              root = pathlib.Path(tmp)
              shutil.copy2('tests/test_historical_perspective.py', root/'test_historical_perspective.py')
              env = {k:v for k,v in os.environ.items() if k != 'PYTHONPATH'}
              subprocess.run([sys.executable, '-c', 'import ciw, pathlib; assert not pathlib.Path(ciw.__file__).resolve().is_relative_to(pathlib.Path(' + repr(str(checkout)) + '))'], cwd=root, env=env, check=True)
              subprocess.run([sys.executable, '-m', 'pytest', '-q', str(root), '-o', 'addopts=', '--junitxml=' + str(report)], cwd=root, env=env, check=True)
              subprocess.run([sys.executable, '-m', 'ciw.perspective_workflow', 'demo', '--output-dir', str(root/'demo')], cwd=root, env=env, check=True)
              subprocess.run([sys.executable, '-m', 'ciw.perspective_workflow', 'inspect', str(root/'demo/workspace.json')], cwd=root, env=env, check=True)
          PY
      - name: Preserve exact source
        if: always()
        run: git archive --format=zip --output=perspective-source.zip HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: historical-perspective-${{ matrix.os }}
          if-no-files-found: error
          path: |
            perspective-source.xml
            perspective-installed.xml
            perspective-source.zip
            dist/*.whl
