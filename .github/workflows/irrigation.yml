name: Qualified agricultural irrigation
on:
  pull_request:
    paths:
      - 'src/ciw/irrigation_*.py'
      - 'src/ciw/operator_commands.py'
      - 'src/ciw/operations/**'
      - 'src/ciw/session.py'
      - 'src/ciw/dependency_graph.py'
      - 'tests/test_irrigation*.py'
      - 'scripts/check_irrigation_installed.py'
      - 'docs/IRRIGATION.md'
      - 'examples/irrigation_request.json'
      - '.github/workflows/irrigation.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: irrigation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualification:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev,legibility]' build
      - name: Independent equations, metrology, retained lifecycle and shared substrate
        shell: bash
        run: python -m pytest -q tests/test_irrigation*.py tests/test_protocol.py tests/test_operation_runner.py tests/test_operation_failure_retention.py tests/test_operation_publication.py tests/test_correction_session.py tests/test_correction_journal.py tests/test_legibility_corrections.py tests/test_operator_catalog.py --junitxml=irrigation-tests.xml
      - name: Require complete qualification
        shell: bash
        run: |
          python - <<'PYTHON'
          import json, platform, subprocess, sys
          import xml.etree.ElementTree as E
          from pathlib import Path
          suites=list(E.parse('irrigation-tests.xml').getroot().iter('testsuite'))
          count=sum(int(s.attrib['tests']) for s in suites)
          assert count > 0
          assert all(int(s.attrib[k]) == 0 for s in suites for k in ('failures','errors','skipped'))
          Path('irrigation-qualification.json').write_text(json.dumps({
            'source_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
            'source_tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),
            'python':sys.version,'platform':platform.platform(),'tests':count,
            'failures':0,'errors':0,'skipped':0,'physical_validation':'not_established',
            'hardware_actuation':'not_performed'},indent=2),encoding='utf-8')
          PYTHON
          python scripts/check_ci_policy.py
          git diff --check
      - run: python -m build --wheel
      - name: Installed wheel outside source checkout
        shell: bash
        run: |
          python -m venv installed-irrigation
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            IRRIGATION_PYTHON="$PWD/installed-irrigation/Scripts/python.exe"
            IRRIGATION_NET="$PWD/installed-irrigation/Scripts/net.exe"
          else
            IRRIGATION_PYTHON="$PWD/installed-irrigation/bin/python"
            IRRIGATION_NET="$PWD/installed-irrigation/bin/net"
          fi
          "$IRRIGATION_PYTHON" -m pip install dist/*.whl
          "$IRRIGATION_PYTHON" scripts/check_irrigation_installed.py --python "$IRRIGATION_PYTHON" --net "$IRRIGATION_NET" --wheel dist/*.whl --output-dir "$RUNNER_TEMP/installed-irrigation-smoke"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: irrigation-${{ matrix.os }}-${{ matrix.python }}
          path: |
            irrigation-tests.xml
            irrigation-qualification.json
            ${{ runner.temp }}/installed-irrigation-smoke/**
            dist/*.whl
          if-no-files-found: error
          retention-days: 14
