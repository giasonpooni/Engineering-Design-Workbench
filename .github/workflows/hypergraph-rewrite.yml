name: Typed hypergraph rewrite
on:
  pull_request:
    paths:
      - 'src/ciw/hypergraph_rewrite.py'
      - 'src/ciw/rewrite_cli.py'
      - 'src/ciw/net.py'
      - 'src/ciw/control_*.py'
      - 'src/ciw/workflow_algebra.py'
      - 'src/ciw/core/identities.py'
      - 'src/ciw/operations/**'
      - 'tests/test_hypergraph_rewrite.py'
      - 'tests/test_workflow_algebra.py'
      - 'tests/test_control_plane.py'
      - 'scripts/check_rewrite_installed.py'
      - 'docs/HYPERGRAPH_REWRITE.md'
      - 'examples/hypergraph-rewrite/**'
      - 'pyproject.toml'
      - '.github/workflows/hypergraph-rewrite.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hypergraph-rewrite-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  qualification:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]' build
      - name: Rewrite and composition regressions
        run: python -m pytest -q tests/test_hypergraph_rewrite.py tests/test_workflow_algebra.py tests/test_control_plane.py --junitxml=rewrite-source.xml
      - name: Require source qualification without skips
        shell: bash
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as E
          suites = list(E.parse('rewrite-source.xml').getroot().iter('testsuite'))
          assert sum(int(s.attrib['tests']) for s in suites) > 0
          assert all(int(s.attrib[k]) == 0 for s in suites for k in ('failures', 'errors', 'skipped'))
          PY
          git diff --check
      - run: python -m build --wheel
      - name: Installed wheel tests outside source with isolated Python
        shell: bash
        run: |
          python scripts/check_rewrite_installed.py --wheel dist/*.whl --tests-root tests --junitxml rewrite-installed.xml > rewrite-installed.json
          cat rewrite-installed.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hypergraph-rewrite-${{ matrix.os }}-python${{ matrix.python }}
          if-no-files-found: error
          path: |
            rewrite-*.xml
            rewrite-installed.json
            dist/*.whl
