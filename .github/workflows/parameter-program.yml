name: Deterministic parameter programs
on:
  pull_request:
    paths:
      - 'src/ciw/parameter_program.py'
      - 'src/ciw/parameter_cli.py'
      - 'src/ciw/control_contracts.py'
      - 'src/ciw/net.py'
      - 'tests/test_parameter_program.py'
      - 'docs/PARAMETER_PROGRAM.md'
      - '.github/workflows/parameter-program.yml'
      - 'src/ciw/system_board.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parameter:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]' build
      - run: python -m pytest -q tests/test_parameter_program.py tests/test_system_board.py --junitxml=parameter-tests.xml
      - name: Require complete qualification
        shell: bash
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as E
          suites=list(E.parse('parameter-tests.xml').getroot().iter('testsuite'))
          assert sum(int(s.attrib['tests']) for s in suites) >= 20
          assert all(int(s.attrib[k]) == 0 for s in suites for k in ('failures','errors','skipped'))
          PY
          git diff --check
      - run: python -m build --wheel
