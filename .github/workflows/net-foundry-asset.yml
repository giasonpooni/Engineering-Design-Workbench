name: NET Foundry asset worker
on:
  pull_request:
    paths:
      - 'src/ciw/foundry*.py'
      - 'src/ciw/production*.py'
      - 'src/ciw/interactive_simulation.py'
      - 'src/ciw/control_*.py'
      - 'tests/test_foundry_asset.py'
      - 'scripts/check_foundry_asset.py'
      - 'scripts/render_foundry_asset.py'
      - '.github/workflows/net-foundry-asset.yml'
      - 'pyproject.toml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]' build
      - name: Asset plus unchanged packet, production, control and session suites
        run: python -m pytest -q tests/test_foundry_asset.py tests/test_foundry_pipeline.py tests/test_foundry.py tests/test_production.py tests/test_game_trace.py tests/test_game_session.py tests/test_game_retention.py tests/test_control_plane.py tests/test_interactive_contract.py tests/test_interactive_session.py -o addopts= --junitxml=asset-source.xml
      - run: python -m build --wheel
      - name: Installed-wheel tests outside checkout
        shell: bash
        run: |
          python - <<'PY'
          import os, pathlib, shutil, subprocess, sys, tempfile
          wheel = next(pathlib.Path('dist').glob('*.whl')).resolve()
          subprocess.run([sys.executable, '-m', 'pip', 'install', '--force-reinstall', '--no-deps', str(wheel)], check=True)
          report = pathlib.Path('asset-wheel.xml').resolve()
          with tempfile.TemporaryDirectory() as tmp:
              root = pathlib.Path(tmp)
              shutil.copy2('tests/test_foundry_asset.py', root / 'test_foundry_asset.py')
              env = {k: v for k, v in os.environ.items() if k != 'PYTHONPATH'}
              subprocess.run([sys.executable, '-m', 'pytest', '-q', str(root), '-o', 'addopts=', '--junitxml='+str(report)], cwd=root, env=env, check=True)
          PY
          git diff --check
      - name: Retain source identity
        if: always()
        shell: bash
        run: |
          git rev-parse HEAD > asset-commit.txt
          git rev-parse HEAD^{tree} > asset-tree.txt
          python -m pip freeze > asset-environment.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: asset-contracts-${{ matrix.os }}
          path: |
            asset-source.xml
            asset-wheel.xml
            asset-commit.txt
            asset-tree.txt
            asset-environment.txt
            dist/*.whl
          if-no-files-found: error
  native:
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Bind existing Blender and Godot versions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/asset-tools"
          cd "$RUNNER_TEMP/asset-tools"
          curl --fail --location --retry 2 --max-time 180 -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip
          echo '02ec53d1cc7dbb9cc6355393c61b9ab43d1244751a124f10248a4802830788cd  godot.zip' | sha256sum --check
          unzip -q godot.zip
          chmod +x Godot_v4.5.1-stable_linux.x86_64
          curl --fail --location --retry 2 --max-time 240 -O https://download.blender.org/release/Blender4.5/blender-4.5.3-linux-x64.tar.xz
          curl --fail --location --retry 2 --max-time 60 -O https://download.blender.org/release/Blender4.5/blender-4.5.3.sha256
          grep ' blender-4.5.3-linux-x64.tar.xz$' blender-4.5.3.sha256 | sha256sum --check
          tar -xf blender-4.5.3-linux-x64.tar.xz
          sha256sum godot.zip blender-4.5.3-linux-x64.tar.xz > "$GITHUB_WORKSPACE/asset-distributions.sha256"
      - name: Install candidate wheel
        run: |
          python -m pip install build
          python -m build --wheel
          python -m pip install dist/*.whl
      - name: Native packet to Blender candidate to independent Godot checks
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          env -u PYTHONPATH python "$GITHUB_WORKSPACE/scripts/check_foundry_asset.py" \
            --blender "$RUNNER_TEMP/asset-tools/blender-4.5.3-linux-x64/blender" \
            --godot "$RUNNER_TEMP/asset-tools/Godot_v4.5.1-stable_linux.x86_64" \
            --output-dir "$GITHUB_WORKSPACE/results/asset-native"
      - name: Inspect actual candidate and rejected asset visually
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends xvfb xauth libgl1-mesa-dri
          cd "$RUNNER_TEMP"
          env -u PYTHONPATH xvfb-run -a python "$GITHUB_WORKSPACE/scripts/render_foundry_asset.py" \
            --godot "$RUNNER_TEMP/asset-tools/Godot_v4.5.1-stable_linux.x86_64" \
            --qualification "$GITHUB_WORKSPACE/results/asset-native" \
            --output-dir "$GITHUB_WORKSPACE/results/asset-previews"
      - name: Retain exact source and environment
        if: always()
        shell: bash
        run: |
          git rev-parse HEAD > asset-commit.txt
          git rev-parse HEAD^{tree} > asset-tree.txt
          git archive --format=zip --output=asset-source.zip HEAD
          python -m pip freeze > asset-environment.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: asset-native-evidence
          path: |
            results/asset-native
            results/asset-previews
            asset-source.zip
            asset-commit.txt
            asset-tree.txt
            asset-environment.txt
            asset-distributions.sha256
            dist/*.whl
          if-no-files-found: error
