name: DSP instrument and four-language bindings
on:
  pull_request:
    paths:
      - 'instruments/dsp/**'
      - 'tools/instrument_bindings.py'
      - 'docs/DSP_INSTRUMENT.md'
      - '.github/workflows/dsp-instrument.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: julia-actions/setup-julia@4c0cb0fce8556fdb04a90347310e5db8b1f98fb9
        with:
          version: '1.10.12'
          arch: x64
      - name: Provision the explicitly selected Rust toolchain
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          rustup default 1.90.0
          python -m pip install pytest==9.0.2
      - name: Native kernel and contract-compiler tests
        run: python -m pytest -q --confcutdir=instruments/dsp instruments/dsp/test_dsp.py --junitxml=dsp-tests.xml
      - name: Actual Python, C++, Rust and Julia callers plus independent references
        run: python instruments/dsp/qualify.py --cxx "$(command -v g++)" --rustc "$(command -v rustc)" --julia "$(command -v julia)" --output-dir dsp-evidence
      - name: Require complete unskipped qualification and retain only this new instrument source
        run: |
          python - <<'PY'
          import json,xml.etree.ElementTree as E
          s=list(E.parse('dsp-tests.xml').getroot().iter('testsuite'))
          assert sum(int(x.attrib['tests']) for x in s)>=36
          assert all(int(x.attrib[k])==0 for x in s for k in ('failures','errors','skipped'))
          r=json.load(open('dsp-evidence/qualification.json'))
          assert r['status']=='passed' and set(r['language_max_absolute_error'])=={'python','cpp','rust','julia-reference'}
          PY
          git diff --check
          git archive --format=zip --output=dsp-source.zip HEAD instruments/dsp tools/instrument_bindings.py docs/DSP_INSTRUMENT.md .github/workflows/dsp-instrument.yml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: dsp-native-evidence
          path: |
            dsp-evidence
            dsp-tests.xml
            dsp-source.zip
          if-no-files-found: error
