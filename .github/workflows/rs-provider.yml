name: GSC raster operations through NET
on:
  pull_request:
    paths:
      - 'src/ciw/rs_*.py'
      - 'src/ciw/spatial_cli.py'
      - 'tests/test_rs_operations.py'
      - 'tests/fixtures/rs/**'
      - 'scripts/check_rs_pipeline.py'
      - 'examples/spatial/rs-provider-pin.json'
      - '.github/workflows/rs-provider.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Preserve exact checkout bytes for the original source pin guard
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: net
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: giasonpooni/Geospatial-Systems-Compiler
          ref: 056dd42cce3131d772273aa41ad232e79ac3e729
          path: gsc
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install original NET pins and optional specialist runtime
        working-directory: net
        run: python -m pip install -e '.[dev]' build -r ../gsc/tools/ciw-rs/requirements.txt
      - name: New and unchanged request, control, agent and simulation tests
        working-directory: net
        run: python -m pytest -q tests/test_rs_operations.py tests/test_spatial_requests.py tests/test_control_plane.py tests/test_agent_protocol.py tests/test_simulation_control.py tests/test_simulation_campaign.py -o addopts= --junitxml=rs-source.xml
      - name: Actual raster IO specialist tests
        run: python -m pytest -q gsc/tools/ciw-rs/test_worker.py --junitxml=net/rs-specialist.xml
      - run: python -m build --wheel
        working-directory: net
      - name: Installed package, real cross-repository worker and retained inspection
        working-directory: net
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,pathlib,subprocess,sys,tempfile,xml.etree.ElementTree as ET
          root=pathlib.Path.cwd()
          pin=json.loads((root/'examples/spatial/rs-provider-pin.json').read_text())
          wheel=next((root/'dist').glob('*.whl'))
          subprocess.run([sys.executable,'-m','pip','install','--force-reinstall','--no-deps',str(wheel)],check=True)
          env={k:v for k,v in os.environ.items() if k!='PYTHONPATH'}
          with tempfile.TemporaryDirectory() as tmp:
              imported=subprocess.check_output([sys.executable,'-I','-c','import ciw;print(ciw.__file__)'],cwd=tmp,env=env,text=True)
              assert not pathlib.Path(imported.strip()).resolve().is_relative_to(root)
              subprocess.run([sys.executable,'-I','-m','pytest','-q',str(root/'tests/test_rs_operations.py'),str(root/'tests/test_spatial_requests.py'),
                  '-o','pythonpath=','-o','addopts=','--junitxml='+str(root/'rs-installed.xml')],cwd=tmp,env=env,check=True)
              subprocess.run([sys.executable,'-I',str(root/'scripts/check_rs_pipeline.py'),
                  '--gsc-repo',str(root.parent/'gsc'),'--gsc-revision',pin['revision'],
                  '--output-dir',str(root/'rs-evidence')],cwd=tmp,env=env,check=True)
              commands=[['spatial','catalog'],['spatial','raster','inspect',str(root/'rs-evidence/baseline-workspace.json')]]
              for number,args in enumerate(commands):
                  with (root/f'rs-cli-{number}.json').open('w') as output:
                      subprocess.run([sys.executable,'-I','-m','ciw.net',*args],cwd=tmp,env=env,stdout=output,check=True)
          for file,count in [('rs-source.xml',365),('rs-installed.xml',95),('rs-specialist.xml',38)]:
              suites=list(ET.parse(file).getroot().iter('testsuite'))
              assert sum(int(s.attrib['tests']) for s in suites)==count
              assert all(int(s.attrib[k])==0 for s in suites for k in ('failures','errors','skipped'))
          report=json.loads((root/'rs-evidence/report.json').read_text())
          assert report['status']=='passed' and report['count']==23
          assert report['provider_revision']==pin['revision']
          assert report['comparison_statuses']==['PASS','FAIL','INDETERMINATE']
          assert report['executions']==7 and report['results']==5 and report['baseline_valid_pixels']==13
          PY
      - name: Retain exact source and environments
        if: always()
        working-directory: net
        shell: bash
        run: |
          git archive --format=zip --output=rs-net-source.zip HEAD
          git -C ../gsc archive --format=zip --output=../net/rs-gsc-source.zip HEAD
          python -m pip freeze > rs-environment.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: net-raster-${{ matrix.os }}
          if-no-files-found: error
          path: |
            net/rs-*.xml
            net/rs-*.zip
            net/rs-*.json
            net/rs-environment.txt
            net/rs-evidence
            net/dist/*.whl
