name: CSR micro-tool qualification
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  microtools:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -e . numpy==2.4.3 pytest==9.0.2 build
      - run: python -m pytest tests/test_microtools.py -o addopts= -q --junitxml=microtools.xml
      - run: python -m build --wheel
      - name: Installed wheel outside checkout
        shell: bash
        run: |
          python - <<'PY'
          import os, pathlib, subprocess, sys, tempfile
          root = pathlib.Path.cwd()
          wheel = next((root / 'dist').glob('*.whl'))
          subprocess.run([sys.executable, '-m', 'pip', 'install', '--force-reinstall', '--no-deps', str(wheel)], check=True)
          env = {k:v for k,v in os.environ.items() if k != 'PYTHONPATH'}
          with tempfile.TemporaryDirectory() as tmp:
              probe = subprocess.run([sys.executable, '-I', '-c', 'import geodesic_testbed; print(geodesic_testbed.__file__)'], cwd=tmp, env=env, capture_output=True, text=True, check=True)
              assert not pathlib.Path(probe.stdout.strip()).resolve().is_relative_to(root)
              subprocess.run([sys.executable, '-I', '-m', 'pytest', str(root / 'tests/test_microtools.py'), '-q', '-o', 'pythonpath=', '-o', 'addopts=', '--junitxml=' + str(root / 'microtools-installed.xml')], cwd=tmp, env=env, check=True)
          PY
      - name: Refuse incomplete evidence
        shell: bash
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as E
          for file in ['microtools.xml', 'microtools-installed.xml']:
              suites = list(E.parse(file).getroot().iter('testsuite'))
              assert sum(int(s.attrib['tests']) for s in suites) >= 50
              assert all(int(s.attrib[k]) == 0 for s in suites for k in ['errors','failures','skipped'])
          PY
      - name: Retain exact public source
        if: always()
        run: git archive --format=zip --output=csr-microtools-source.zip HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: csr-microtools-${{ matrix.os }}
          if-no-files-found: error
          path: |
            microtools*.xml
            csr-microtools-source.zip
            dist/*.whl
