name: Game project production
on:
  pull_request:
    paths:
      - 'src/ciw/game_project*.py'
      - 'src/ciw/production*.py'
      - 'tests/test_game_project*.py'
      - 'scripts/check_game_project.py'
      - '.github/workflows/game-project-production.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]' build
      - run: python -m pytest -q tests/test_game_project.py tests/test_game_project_feedback.py tests/test_production.py tests/test_game_trace.py tests/test_game_session.py tests/test_game_retention.py tests/test_control_plane.py tests/test_interactive_contract.py tests/test_interactive_session.py --junitxml=project-source.xml
      - run: python -m build --wheel
      - name: Installed worker outside checkout
        shell: bash
        run: |
          python - <<'PY'
          import os, pathlib, shutil, subprocess, sys, tempfile, xml.etree.ElementTree as ET
          report=pathlib.Path('project-installed.xml').resolve()
          wheel=next(pathlib.Path('dist').glob('*.whl')).resolve()
          subprocess.run([sys.executable,'-m','pip','install','--force-reinstall','--no-deps',str(wheel)],check=True)
          with tempfile.TemporaryDirectory() as tmp:
              root=pathlib.Path(tmp)
              for name in ('test_game_project.py','test_game_project_feedback.py'):
                  shutil.copy2(pathlib.Path('tests')/name,root/name)
              env={k:v for k,v in os.environ.items() if k!='PYTHONPATH'}
              subprocess.run([sys.executable,'-m','pytest','-q',str(root),'--junitxml='+str(report)],cwd=root,env=env,check=True)
          for filename,count in [('project-source.xml',356),('project-installed.xml',65)]:
              suites=list(ET.parse(filename).getroot().iter('testsuite'))
              assert sum(int(s.attrib['tests']) for s in suites)>=count
              assert all(int(s.attrib[k])==0 for s in suites for k in ('failures','errors','skipped'))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: game-project-contracts-${{ matrix.os }}
          if-no-files-found: error
          path: |
            project-*.xml
            dist/*.whl
  native:
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: giasonpooni/1792
          ref: 70fcc477fb3783847fea56fa0ccaa5868413226f
          path: title-source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Original pinned title engine
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/game-engine"
          curl --fail --location --retry 3 --max-time 180 \
            https://github.com/godotengine/godot-builds/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip \
            -o "$RUNNER_TEMP/game-engine/godot.zip"
          echo "02ec53d1cc7dbb9cc6355393c61b9ab43d1244751a124f10248a4802830788cd  $RUNNER_TEMP/game-engine/godot.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/game-engine/godot.zip" -d "$RUNNER_TEMP/game-engine"
          chmod +x "$RUNNER_TEMP/game-engine/Godot_v4.5.1-stable_linux.x86_64"
      - run: |
          python -m pip install build
          python -m build --wheel
          python -m pip install dist/*.whl
          python title-source/tools/check_net_profile.py
      - name: Real title batch, correction, checkpoint, missingness and refusal
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          env -u PYTHONPATH python "$GITHUB_WORKSPACE/scripts/check_game_project.py" \
            --godot "$RUNNER_TEMP/game-engine/Godot_v4.5.1-stable_linux.x86_64" \
            --source-root "$GITHUB_WORKSPACE/title-source/game" \
            --profile "$GITHUB_WORKSPACE/title-source/tools/net/water-round.profile.json" \
            --profile-sha256 sha256:513a3316187fc981857c2f000bf614ee87e17ee123a4be2e7a00a6d5f7bf38e9 \
            --output-dir "$GITHUB_WORKSPACE/results/game-project"
      - name: Exact source archives
        if: always()
        run: |
          git archive --format=zip --output=game-project-net-source.zip HEAD
          git -C title-source archive --format=zip --output=../game-project-title-source.zip HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: game-project-native-evidence
          if-no-files-found: error
          path: |
            results/game-project
            game-project-*-source.zip
            dist/*.whl
