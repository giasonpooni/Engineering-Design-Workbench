name: Legibility instrument
on:
  pull_request:
    paths:
      - 'src/ciw/**'
      - 'tests/test_legibility*.py'
      - 'tests/test_capabilities.py'
      - 'pyproject.toml'
      - '.github/workflows/legibility.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  boundary-and-installed-wheel:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev,legibility]"
      - run: python -c "import pathlib, pytest; raise SystemExit(pytest.main([str(p) for p in sorted(pathlib.Path('tests').glob('test_legibility*.py'))] + ['tests/test_capabilities.py', 'tests/test_protocol.py']))"
      - run: python -m pip wheel --no-deps . --wheel-dir dist
      - run: python -m pip uninstall -y computational-instrumentation-workbench
      - name: Install wheel and exercise outside source tree
        run: |
          python -c "import pathlib, subprocess, sys; subprocess.run([sys.executable, '-m', 'pip', 'install', '--no-deps', str(next(pathlib.Path('dist').glob('*.whl')))], check=True)"
          python -c "import os, pathlib, subprocess, sys, tempfile; d=pathlib.Path(tempfile.mkdtemp()); env=dict(os.environ); env.pop('PYTHONPATH', None); subprocess.run([sys.executable, '-m', 'ciw', 'legibility', 'demo', '--output-dir', str(d/'specimen')], cwd=d, env=env, check=True); subprocess.run([sys.executable, '-m', 'ciw', 'legibility', 'verify', str(d/'specimen'), '--trust', str(d/'specimen'/'demo-trust.json'), '--expected-version', '1'], cwd=d, env=env, check=True)"
