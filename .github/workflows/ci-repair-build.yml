name: Materialize and verify inbox CI repair
on:
  push:
    branches: [fix/inbox-ci-repair]
    paths:
      - .github/workflows/ci-repair-build.yml
      - scripts/apply_ci_recovery.py
      - scripts/ci_provider_access.py
      - tests/test_ci_recovery.py
permissions:
  contents: write
concurrency:
  group: inbox-ci-repair-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-and-publish-candidate:
    if: github.ref == 'refs/heads/fix/inbox-ci-repair' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Materialize reviewed readable source and workflow repairs
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply_ci_recovery.py
          echo 'ab99d7b8342015086b26011da1a894980a82b1ad7b11cbca9114e135402a3cc6  src/ciw/workbench.py' | sha256sum --check --strict
          rm scripts/apply_ci_recovery.py .github/workflows/ci-repair-build.yml
          git diff --check
          mkdir -p "$RUNNER_TEMP/ci-repair-evidence"
          git diff --binary > "$RUNNER_TEMP/ci-repair-evidence/repair.patch"
          python -m pip install -e '.[dev,openusd]'
          python -m pip freeze > "$RUNNER_TEMP/ci-repair-evidence/environment.txt"
      - name: Run source regression without removing optional-provider checks
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_ci_policy.py
          python -m pytest -q --junitxml="$RUNNER_TEMP/ci-repair-evidence/source.xml" 2>&1 | tee "$RUNNER_TEMP/ci-repair-evidence/source.txt"
          python -m compileall -q src scripts
      - name: Require all focused repair and real SDK tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_ci_recovery.py tests/test_project_workflow.py tests/test_energy_workflow.py tests/test_pilot_scope.py tests/test_usd_export.py --junitxml="$RUNNER_TEMP/ci-repair-evidence/focused.xml" 2>&1 | tee "$RUNNER_TEMP/ci-repair-evidence/focused.txt"
          python - "$RUNNER_TEMP/ci-repair-evidence/focused.xml" <<'PY'
          import sys, xml.etree.ElementTree as ET
          cases = list(ET.parse(sys.argv[1]).getroot().iter('testcase'))
          assert len(cases) == 77, len(cases)
          assert not any(c.find(tag) is not None for c in cases for tag in ('failure','error','skipped'))
          PY
      - name: Build and exercise installed wheel outside the checkout
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/ci-repair-evidence"
          python -m pip wheel --no-deps . -w "$output/wheel"
          python -m venv "$RUNNER_TEMP/ci-repair-env"
          py="$RUNNER_TEMP/ci-repair-env/bin/python"
          "$py" -m pip install "$output"/wheel/*.whl pytest==9.0.2 usd-core==25.11
          "$py" scripts/check_installed.py > "$output/installed-cli.txt"
          mkdir -p "$RUNNER_TEMP/ci-repair-tests"
          cp tests/test_project_workflow.py tests/test_energy_workflow.py tests/test_energy_records.py tests/test_pilot_scope.py tests/test_usd_export.py "$RUNNER_TEMP/ci-repair-tests/"
          cd "$RUNNER_TEMP/ci-repair-tests"
          unset PYTHONPATH PYTEST_ADDOPTS
          "$py" -I -c 'import ciw,sys; from pathlib import Path; assert Path(ciw.__file__).resolve().is_relative_to(Path(sys.prefix).resolve()); print(ciw.__file__)' > "$output/installed-import.txt"
          "$py" -I -m pytest -q test_project_workflow.py test_energy_workflow.py test_pilot_scope.py test_usd_export.py --junitxml="$output/installed.xml" 2>&1 | tee "$output/installed.txt"
          "$py" - "$output/installed.xml" <<'PY'
          import sys, xml.etree.ElementTree as ET
          cases = list(ET.parse(sys.argv[1]).getroot().iter('testcase'))
          assert len(cases) == 55, len(cases)
          assert not any(c.find(tag) is not None for c in cases for tag in ('failure','error','skipped'))
          PY
          "$py" -I -m ciw.pilot --output-dir "$output/pilot" --with-usd > "$output/pilot.json"
          "$py" -I -m ciw.usd_export verify "$output/pilot/scene" > "$output/usd-reload.json"
      - name: Publish only the tested candidate branch, never main
        env:
          GH_WRITE_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess
          branch = 'refs/heads/fix/inbox-ci-repair'
          if os.environ['GITHUB_REF'] != branch or os.environ['GITHUB_REPOSITORY'] != 'giasonpooni/Notations-Design-Terminal':
              raise SystemExit('Refuse unexpected write destination')
          root = pathlib.Path.cwd()
          if hashlib.sha256((root/'src/ciw/workbench.py').read_bytes()).hexdigest() != 'ab99d7b8342015086b26011da1a894980a82b1ad7b11cbca9114e135402a3cc6':
              raise SystemExit('Tested source changed')
          subprocess.run(['git','diff','--check'], check=True)
          subprocess.run(['git','add','-u'], check=True)
          tree = subprocess.check_output(['git','write-tree'], text=True).strip()
          subprocess.run(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','fix: restore project registration and harden CI provider access and scheduling'], check=True)
          commit = subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          token = os.environ.pop('GH_WRITE_TOKEN')
          header = 'AUTHORIZATION: basic ' + base64.b64encode(('x-access-token:'+token).encode()).decode()
          env = dict(os.environ, GIT_CONFIG_COUNT='1', GIT_CONFIG_KEY_0='http.https://github.com/.extraheader', GIT_CONFIG_VALUE_0=header, GIT_TERMINAL_PROMPT='0')
          subprocess.run(['git','push','https://github.com/giasonpooni/Notations-Design-Terminal.git','HEAD:'+branch], env=env, check=True)
          output = pathlib.Path(os.environ['RUNNER_TEMP'])/'ci-repair-evidence'
          (output/'published.json').write_text(json.dumps({'commit':commit,'tree':tree,'branch':branch,'main_modified':False,'private_provider_qualification':'not_performed','cryptographic_qualification':'not_performed'},indent=2)+'\n')
          print('Published tested candidate',commit)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ci-inbox-repair-evidence
          path: ${{ runner.temp }}/ci-repair-evidence
          if-no-files-found: error
          retention-days: 14
