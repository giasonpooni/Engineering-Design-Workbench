name: FSRT view public input boundary
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  input-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest build
      - name: Input boundary only, not real-provider qualification
        run: python -m pytest -q tests/test_fsrt_view.py -k public_ -o addopts=
      - run: python -m compileall -q src/ciw/fsrt_view.py
      - run: python -m build --wheel
# Full unchanged provider tests require private RCI and run in RCI PR #2.
# No private credentials, source, or calibration provider is mounted here.
