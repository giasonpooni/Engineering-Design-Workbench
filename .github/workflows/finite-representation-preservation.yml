name: Finite representation preservation
on:
  pull_request:
    paths:
      - 'src/ciw/board_morphisms.py'
      - 'src/ciw/finite_preservation.py'
      - 'src/ciw/control_contracts.py'
      - 'tests/test_board_morphisms.py'
      - 'tests/test_finite_preservation.py'
      - 'docs/FINITE_REPRESENTATION_PRESERVATION.md'
      - '.github/workflows/finite-representation-preservation.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: finite-preservation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualification:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]' build
      - name: Existing representation regressions
        run: python -m pytest -q tests/test_representation_interventions.py tests/test_representation_morphisms.py tests/test_needle.py --junitxml=preservation-tests.xml
      - run: python -m build --wheel
      - name: Retain exact tracked source
        shell: bash
        run: |
          git rev-parse HEAD > source-commit.txt
          git archive --format=zip --output=terminal-source.zip HEAD
          git diff --check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: finite-preservation-${{ matrix.os }}
          path: |
            terminal-source.zip
            source-commit.txt
            preservation-tests.xml
            dist/*.whl
          if-no-files-found: error
          retention-days: 14
