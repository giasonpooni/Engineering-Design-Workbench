name: Visual System Board
on:
  pull_request:
    paths:
      - 'src/ciw/visual_board.py'
      - 'src/ciw/visual_board_server.py'
      - 'src/ciw/web/system_board.*'
      - 'src/ciw/board_cli.py'
      - 'src/ciw/control_contracts.py'
      - 'src/ciw/system_board.py'
      - 'src/ciw/parameter_program.py'
      - 'src/ciw/needle.py'
      - 'tests/test_visual_board.py'
      - 'validation/visual_board_browser.py'
      - 'docs/VISUAL_SYSTEM_BOARD.md'
      - '.github/workflows/visual-system-board.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: visual-board-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualification:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]' build
      - name: Visual Board and all inherited expansion regressions
        run: python -m pytest -q tests/test_visual_board.py tests/test_representation_expansion.py tests/test_board_morphisms.py tests/test_finite_preservation.py tests/test_representation_interventions.py tests/test_representation_morphisms.py tests/test_needle.py tests/test_system_board.py tests/test_parameter_program.py tests/test_semantic_capabilities.py tests/test_covariance_artifacts.py tests/test_covariance_records.py tests/test_thermal_contract.py --junitxml=visual-board-tests.xml
      - name: Require complete numerical and transport qualification
        shell: bash
        run: |
          python - <<'PY'
          import json, platform, subprocess, sys
          from pathlib import Path
          import xml.etree.ElementTree as E
          import numpy
          suites=list(E.parse('visual-board-tests.xml').getroot().iter('testsuite'))
          count=sum(int(s.attrib['tests']) for s in suites)
          assert count >= 239
          assert all(int(s.attrib[k]) == 0 for s in suites for k in ('failures','errors','skipped'))
          Path('qualification.json').write_text(json.dumps({
              'source_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
              'tests':count,'failures':0,'errors':0,'skipped':0,
              'python':sys.version,'numpy':numpy.__version__,'platform':platform.platform()
          },indent=2),encoding='utf-8')
          PY
          python scripts/check_ci_policy.py
          git diff --check
      - run: python -m build --wheel
      - name: Install the actual wheel for browser qualification
        shell: bash
        run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - name: Provision actual Chromium
        if: runner.os == 'Linux'
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Actual browser views and ordinary Needle execution
        if: runner.os == 'Linux'
        run: python -I validation/visual_board_browser.py --output-dir browser-evidence
      - name: Require full browser qualification, not embedded-only testing
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('browser-evidence/browser-report.json').read_text())
          assert r['status']=='passed' and r['count']>=55
          assert r['offline_document_mode']=='file'
          assert r['live_browser_execution']=='performed'
          assert not r['errors'] and not r['external_requests']
          PY
      - name: Retain exact source on success or failure
        if: always()
        shell: bash
        run: |
          git rev-parse HEAD > source-commit.txt
          git archive --format=zip --output=terminal-source.zip HEAD
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: visual-system-board-${{ matrix.os }}
          path: |
            source-commit.txt
            terminal-source.zip
            visual-board-tests.xml
            qualification.json
            browser-evidence
            dist/*.whl
          if-no-files-found: error
          retention-days: 14
