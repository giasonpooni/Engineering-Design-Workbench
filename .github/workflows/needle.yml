name: Needle selective recomputation
on:
  pull_request:
    paths:
      - 'src/ciw/needle.py'
      - 'src/ciw/needle_cli.py'
      - 'src/ciw/control_contracts.py'
      - 'src/ciw/net.py'
      - 'tests/test_needle.py'
      - 'docs/NEEDLE.md'
      - '.github/workflows/needle.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  needle:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]' build
      - name: Needle contract + real oscillator tests
        run: python -m pytest -q tests/test_needle.py tests/test_container_calculus.py --junitxml=needle-tests.xml
      - name: Require complete qualification
        shell: bash
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as E
          suites=list(E.parse('needle-tests.xml').getroot().iter('testsuite'))
          assert sum(int(s.attrib['tests']) for s in suites) >= 20
          assert all(int(s.attrib[k]) == 0 for s in suites for k in ('failures','errors','skipped'))
          PY
          git diff --check
      - run: python -m build --wheel
