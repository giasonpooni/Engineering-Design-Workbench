name: Pinned telemetry replay

on:
  push:
    branches: [main]
    tags: ['**']
    paths-ignore:
      - 'README.md'
      - 'docs/**/*.md'
      - 'deploy/**/*.md'
      - 'godot/**/*.md'
      - 'examples/**/README.md'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'docs/**/*.md'
      - 'deploy/**/*.md'
      - 'godot/**/*.md'
      - 'examples/**/README.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: true

jobs:
  telemetry:
    env:
      CIW_PROVIDER_READ_TOKEN: ${{ ((github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))) || github.event_name == 'workflow_dispatch') && secrets.CIW_PROVIDER_READ_TOKEN || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Configure read-only private-provider access
        run: python scripts/ci_provider_access.py configure
      - run: python -m pip install -e ".[dev]"
      - name: Recompute pinned PPDA, STFE, GSIE, SET and optional CBSR
        run: python scripts/check_telemetry.py
