name: Portable instrument contract
on:
  pull_request:
    paths:
      - 'src/ciw/instrument_*.py'
      - 'src/ciw/semantic_*.py'
      - 'src/ciw/control_plane.py'
      - 'src/ciw/net.py'
      - 'tests/test_instrument_contracts.py'
      - 'docs/INSTRUMENT_CONTRACT.md'
      - '.github/workflows/instrument-contract.yml'
      - 'pyproject.toml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]' build
      - name: Portable-instrument, semantic and unchanged controller contracts
        run: python -m pytest -q tests/test_instrument_contracts.py tests/test_semantic_capabilities.py tests/test_control_plane.py --junitxml=instrument-tests.xml
      - name: Require complete unskipped contract qualification
        shell: bash
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as E
          suites=list(E.parse('instrument-tests.xml').getroot().iter('testsuite'))
          assert sum(int(s.attrib['tests']) for s in suites) >= 70
          assert all(int(s.attrib[k]) == 0 for s in suites for k in ('failures','errors','skipped'))
          PY
          git diff --check
      - run: python -m build --wheel
      - name: Installed-wheel CLI outside checkout
        shell: bash
        run: |
          python - <<'PY'
          import json,os,pathlib,subprocess,sys,tempfile
          wheel=next(pathlib.Path('dist').glob('*.whl')).resolve()
          subprocess.run([sys.executable,'-m','pip','install','--force-reinstall','--no-deps',str(wheel)],check=True)
          manifest={
            "schema":"notations.instrument.v1",
            "identity":{"name":"Fixture","slug":"fixture","version":"0.1.0","maturity":"INSTRUMENT","brand":"Notation Systems","positioning":"Frontier Tooling and Instrumentation for Digital Futures"},
            "operation":{"id":"fixture.op.v1","semantic_capability":"fixture.compute.v1","purpose":"fixture","deterministic_given_inputs":True,"kind":"compute","effects":[]},
            "provider":{"id":"org.notationsystems.fixture","runtime_family":"python","execution_profile":"scientific","execution_mode":"headless","resources":["cpu"],"priority":100,
              "ports":{"inputs":{},"outputs":{"result":{"schema":"fixture.result.v1","unit":None,"frame":None}}}},
            "implementation":{"language":"Python","runtime":"CPython 3.12","network_required":False,"hardware_required":False},
            "model":{},"inputs":{},"outputs":{},"verification":{},"representations":{},"limits":[]
          }
          verification={"schema":"notations.verification.v1","instrument":manifest["identity"],"operation_id":"fixture.op.v1","source_revision":"fixture-revision",
                        "junit":{"tests":1,"failures":0,"errors":0,"skipped":0},"claims":["fixture"],"not_claimed":["execution"]}
          with tempfile.TemporaryDirectory() as tmp:
            root=pathlib.Path(tmp)
            (root/'instrument.json').write_text(json.dumps(manifest))
            (root/'verification.json').write_text(json.dumps(verification))
            env={k:v for k,v in os.environ.items() if k!='PYTHONPATH'}
            out=subprocess.check_output([sys.executable,'-m','ciw.net','instrument','inspect',str(root/'instrument.json'),'--verification',str(root/'verification.json')],cwd=root,env=env,text=True)
            result=json.loads(out)
            assert result['descriptor']['provider_status']=='advertised_unbound'
            assert result['descriptor']['authorizes_execution'] is False
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: instrument-contract-${{ matrix.os }}
          if-no-files-found: error
          path: |
            instrument-tests.xml
            dist/*.whl
