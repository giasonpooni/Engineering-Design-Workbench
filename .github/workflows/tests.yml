name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.10.10"
      - name: Run quickstart
        run: uv run --python ${{ matrix.python }} python examples/quickstart.py
      - name: Run unknown-plant example
        run: uv run --python ${{ matrix.python }} python examples/unknown_plant.py
      - name: Build package
        run: uv build --python ${{ matrix.python }}
      - name: Run default suite
        run: uv run --python ${{ matrix.python }} --dev pytest -q

  kernels:
    name: pinned kernels
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.10.10"
      - name: Install pinned extras
        run: uv pip install --python 3.13 --system -e ".[kernels]"
      - name: Import companion contracts
        run: python -c "import sensitivity, lyapunov, instrument_chain; print(sensitivity.__name__, lyapunov.__name__, instrument_chain.__name__)"
      - name: Run live kernel tests
        run: uv run --python 3.13 --dev pytest -q -m live
