name: Spatial and mesh realization adapters
on:
  pull_request:
    paths:
      - 'src/ciw/representation_realizations.py'
      - 'tests/test_spatial_mesh_realizations.py'
      - 'tests/test_spatial_view.py'
      - 'tests/test_geometry_mesh_contract.py'
      - 'docs/SPATIAL_MESH_REALIZATIONS.md'
      - '.github/workflows/spatial-mesh-realizations.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: spatial-mesh-realizations-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualification:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]' build
      - name: Spatial realization and scientific regression qualification
        run: >-
          python -m pytest -q
          tests/test_spatial_mesh_realizations.py
          tests/test_spatial_view.py
          tests/test_geometry_mesh_contract.py
          tests/test_representation_realizations.py
          tests/test_representation_expansion.py
          tests/test_board_morphisms.py
          tests/test_finite_preservation.py
          tests/test_representation_interventions.py
          tests/test_representation_morphisms.py
          tests/test_needle.py
          tests/test_system_board.py
          tests/test_parameter_program.py
          tests/test_semantic_capabilities.py
          tests/test_covariance_artifacts.py
          tests/test_covariance_records.py
          tests/test_thermal_contract.py
          --junitxml=spatial-realization-tests.xml
      - name: Require complete qualification and retain environment
        shell: bash
        run: |
          python - <<'PYTHON'
          import json, platform, subprocess, sys
          import xml.etree.ElementTree as E
          import numpy
          from pathlib import Path
          suites=list(E.parse('spatial-realization-tests.xml').getroot().iter('testsuite'))
          count=sum(int(s.attrib['tests']) for s in suites)
          assert count >= 226
          assert all(int(s.attrib[k]) == 0 for s in suites for k in ('failures','errors','skipped'))
          report={'source_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
                  'python':sys.version,'platform':platform.platform(),'numpy':numpy.__version__,
                  'tests':count,'failures':0,'errors':0,'skipped':0,
                  'trusted_realization_families':['geographic-context.v1','mesh-edge-result.v1'],
                  'coordinate_transform_performed':False,
                  'continuous_surface_solver_claimed':False,
                  'provider_execution':False,'state_admission':False}
          Path('qualification.json').write_text(json.dumps(report,indent=2),encoding='utf-8')
          PYTHON
          python scripts/check_ci_policy.py
      - run: python -m build --wheel
      - name: Retain exact tracked source
        shell: bash
        run: |
          git rev-parse HEAD > source-commit.txt
          git archive --format=zip --output=terminal-source.zip HEAD
          git diff --check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: spatial-mesh-realizations-${{ matrix.os }}
          path: |
            terminal-source.zip
            source-commit.txt
            spatial-realization-tests.xml
            qualification.json
            dist/*.whl
          if-no-files-found: error
          retention-days: 14
