name: Terminal polyglot qualification
on:
  pull_request:
    paths: ['.github/workflows/terminal-polyglot.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_TARGET_DIR: ${{ runner.temp }}/scr-target
      JULIA_DEPOT_PATH: ${{ runner.temp }}/julia-depot
      JULIA_NUM_THREADS: '1'
      JULIA_PKG_PRECOMPILE_AUTO: '0'
    steps:
      - name: Read this repository at the unchanged approved provider commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: fd61efb3e0e5868d0f95ba27706b64a9afca595f
          path: scr
          persist-credentials: false
      - name: Read the public Terminal integration at its explicit commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: giasonpooni/Notations-Engineering-Terminal
          ref: a607122cb90507f98e7bcff39a3f488de4576bff
          path: terminal
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: julia-actions/setup-julia@4c0cb0fce8556fdb04a90347310e5db8b1f98fb9 # v2 resolved 2026-09-28
        with:
          version: '1.10.12'
          arch: x64
      - name: Install declared Rust toolchain and build existing host
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
          cargo build --locked --manifest-path scr/crates/execution-provider-host/Cargo.toml
          cargo test --locked --manifest-path scr/crates/execution-provider-host/Cargo.toml
      - name: Install the actual Terminal and provision pinned Julia packages
        run: |
          python -m pip install ./terminal
          mkdir -p "$JULIA_DEPOT_PATH"
          julia --startup-file=no --project=terminal/runtimes/native-interop -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'
          julia --startup-file=no --project=terminal/runtimes/julia-oscillator -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'
      - name: Bind the built executable without modifying approved source or pins
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, shutil, subprocess
          root = pathlib.Path.cwd()
          scr = root / 'scr'
          assert subprocess.check_output(['git','-C',str(scr),'rev-parse','HEAD'], text=True).strip() == 'fd61efb3e0e5868d0f95ba27706b64a9afca595f'
          assert not subprocess.check_output(['git','-C',str(scr),'status','--porcelain','--untracked-files=all'], text=True).strip()
          host = pathlib.Path(os.environ['CARGO_TARGET_DIR']) / 'debug/scr-provider-host'
          binding = dict(scr=str(scr), host=str(host), host_sha256='sha256:'+hashlib.sha256(host.read_bytes()).hexdigest(),
                         julia=shutil.which('julia'), julia_runtime=str(root/'terminal'), julia_depot=os.environ['JULIA_DEPOT_PATH'])
          (root/'runtime.json').write_text(json.dumps(binding), encoding='utf-8')
          PY
      - name: Require real C++ AND Julia, reproduction and fresh replay
        run: python terminal/scripts/check_polyglot_native.py --binding runtime.json --output-dir native-evidence
      - name: Retain evidence privately; never include source checkouts or bindings
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: terminal-polyglot-native-evidence
          path: native-evidence/*.json
          if-no-files-found: error
          retention-days: 14
