name: DSP conditioning and synthetic pump qualification

on:
  pull_request:
    paths:
      - 'src/ciw/dsp*.py'
      - 'src/ciw/net.py'
      - 'src/ciw/session.py'
      - 'src/ciw/operations/**'
      - 'src/ciw/core/**'
      - 'instruments/measurement/signal-processing/**'
      - 'instruments/measurement/signal-conditioning/**'
      - 'tests/test_dsp_pipeline*.py'
      - 'scripts/check_dsp_pipeline.py'
      - 'docs/DSP_PIPELINE.md'
      - 'pyproject.toml'
      - '.github/workflows/dsp-pipeline.yml'
  push:
    branches: [main]
    tags: ['**']
    paths:
      - 'src/ciw/dsp*.py'
      - 'src/ciw/net.py'
      - 'src/ciw/session.py'
      - 'src/ciw/operations/**'
      - 'src/ciw/core/**'
      - 'instruments/measurement/signal-processing/**'
      - 'instruments/measurement/signal-conditioning/**'
      - 'tests/test_dsp_pipeline*.py'
      - 'scripts/check_dsp_pipeline.py'
      - 'docs/DSP_PIPELINE.md'
      - 'pyproject.toml'
      - '.github/workflows/dsp-pipeline.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: true

jobs:
  numerical-and-installed:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Install the workbench and the optional numerical instrument
        run: python -m pip install ".[dev]" "./instruments/measurement/signal-processing" "./instruments/measurement/signal-conditioning[dsp]"
      - name: DSP numerical and retention qualification
        run: python -m pytest -q tests/test_dsp_pipeline.py tests/test_dsp_pipeline_numerics.py tests/test_dsp_pipeline_contract.py --junitxml=results/dsp-pipeline-tests.xml
      - name: Preserve the existing bounded window-mean contract
        working-directory: instruments/measurement/signal-processing
        run: python -m pytest -q tests/test_window.py -k "not set_exchange_projection and not ciw_exchange_inspection" --junitxml=../../../results/dsp-window-tests.xml
      - name: Require executed qualification without skips
        run: python -c "import pathlib, xml.etree.ElementTree as E; reports = list(pathlib.Path('results').glob('dsp-*-tests.xml')); assert len(reports) == 2; suites = [s for p in reports for s in E.parse(p).getroot().iter('testsuite')]; assert all(int(s.attrib['tests']) > 0 and all(int(s.attrib.get(k, 0)) == 0 for k in ('failures', 'errors', 'skipped')) for s in suites)"
      - name: Build three independently installable wheels
        run: |
          python -m pip wheel --no-deps . --wheel-dir dist/dsp-pipeline
          python -m pip wheel --no-deps ./instruments/measurement/signal-processing --wheel-dir dist/dsp-pipeline
          python -m pip wheel --no-deps ./instruments/measurement/signal-conditioning --wheel-dir dist/dsp-pipeline
      - name: Exercise isolated installed CLI from outside source imports
        run: python scripts/check_dsp_pipeline.py --wheel-dir dist/dsp-pipeline --output-dir results/dsp-installed
      - name: Retain numerical reports, wheels and installed journey
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dsp-pipeline-${{ matrix.os }}-python-${{ matrix.python }}
          if-no-files-found: error
          path: |
            results/dsp-pipeline-tests.xml
            results/dsp-window-tests.xml
            results/dsp-installed/
            dist/dsp-pipeline/*.whl
