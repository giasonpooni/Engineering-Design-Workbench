name: NET Godot physics backend comparison
on:
  pull_request:
    paths:
      - 'src/ciw/foundry*.py'
      - 'src/ciw/production*.py'
      - 'src/ciw/control_*.py'
      - 'src/ciw/session.py'
      - 'src/ciw/interactive_simulation.py'
      - 'tests/test_foundry_physics.py'
      - 'scripts/check_foundry_physics.py'
      - '.github/workflows/net-foundry-physics.yml'
      - 'pyproject.toml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]' build
      - name: Physics contracts and inherited Foundry, Session and control regressions
        run: python -m pytest -q tests/test_foundry_physics.py tests/test_foundry_asset.py tests/test_foundry_pipeline.py tests/test_foundry.py tests/test_production.py tests/test_game_trace.py tests/test_game_session.py tests/test_game_retention.py tests/test_control_plane.py tests/test_interactive_contract.py tests/test_interactive_session.py -o addopts= --junitxml=physics-source.xml
      - run: python -m build --wheel
      - name: Installed-wheel contract tests outside source tree
        shell: bash
        run: |
          python - <<'PY'
          import pathlib, os, shutil, subprocess, sys, tempfile
          wheel = next(pathlib.Path('dist').glob('*.whl')).resolve()
          subprocess.run([sys.executable, '-m', 'pip', 'install', '--force-reinstall', '--no-deps', str(wheel)], check=True)
          result = pathlib.Path('physics-wheel.xml').resolve()
          with tempfile.TemporaryDirectory() as tmp:
              root = pathlib.Path(tmp)
              shutil.copy2('tests/test_foundry_physics.py', root / 'test_foundry_physics.py')
              env = {k:v for k,v in os.environ.items() if k != 'PYTHONPATH'}
              subprocess.run([sys.executable,'-m','pytest','-q',str(root),'-o','addopts=','--junitxml='+str(result)],cwd=root,env=env,check=True)
          PY
          git diff --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: physics-contracts-${{ matrix.os }}
          path: |
            physics-source.xml
            physics-wheel.xml
            dist/*.whl
          retention-days: 90
  native:
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: giasonpooni/1792
          ref: 4869eac467288b99c32268df99d4a06e573fb28d
          path: game-source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Bind unchanged official Godot binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/physics-tools"
          cd "$RUNNER_TEMP/physics-tools"
          curl --fail --location --retry 2 --max-time 180 -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip
          echo '02ec53d1cc7dbb9cc6355393c61b9ab43d1244751a124f10248a4802830788cd  godot.zip' | sha256sum --check
          unzip -q godot.zip
          chmod +x Godot_v4.5.1-stable_linux.x86_64
      - run: |
          python -m pip install build
          python -m build --wheel
          python -m pip install dist/*.whl
      - name: Original game suites on both explicit backends twice
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          env -u PYTHONPATH python "$GITHUB_WORKSPACE/scripts/check_foundry_physics.py" \
            --game-root "$GITHUB_WORKSPACE/game-source" \
            --godot "$RUNNER_TEMP/physics-tools/Godot_v4.5.1-stable_linux.x86_64" \
            --output-dir "$GITHUB_WORKSPACE/results/physics-native"
      - name: Retain exact source, game and environment identities
        if: always()
        shell: bash
        run: |
          git rev-parse HEAD > physics-source-commit.txt
          git rev-parse HEAD^{tree} > physics-source-tree.txt
          git archive --format=zip --output=physics-source.zip HEAD
          git -C game-source rev-parse HEAD > physics-game-commit.txt
          git -C game-source diff --exit-code
          python -m pip freeze > physics-environment.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: physics-native-evidence
          path: |
            results/physics-native
            physics-source.zip
            physics-source-commit.txt
            physics-source-tree.txt
            physics-game-commit.txt
            physics-environment.txt
            dist/*.whl
          retention-days: 90
