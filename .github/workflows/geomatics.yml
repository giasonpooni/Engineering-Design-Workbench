name: Geomatics reference tools

on:
  pull_request:
    paths:
      - 'src/net_geomatics/**'
      - 'src/ciw/geomatics_*.py'
      - 'src/ciw/operations/**'
      - 'src/ciw/session.py'
      - 'src/ciw/operator_commands.py'
      - 'tests/test_geomatics_*.py'
      - 'pyproject.toml'
      - '.github/workflows/geomatics.yml'
  push:
    branches: [main]
    paths:
      - 'src/net_geomatics/**'
      - 'src/ciw/geomatics_*.py'
      - 'src/ciw/operations/**'
      - 'src/ciw/session.py'
      - 'src/ciw/operator_commands.py'
      - 'tests/test_geomatics_*.py'
      - 'pyproject.toml'
      - '.github/workflows/geomatics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference-tools:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - run: python -m ciw.net geomatics catalog
      - run: >-
          python -m pytest -q
          tests/test_geomatics_gis.py
          tests/test_geomatics_eo.py
          tests/test_geomatics_radiometry_urban.py
          tests/test_geomatics_workflow.py
          tests/test_geomatics_audit.py
