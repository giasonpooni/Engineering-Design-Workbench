name: Synthetic FSRT view source review
on:
  pull_request:
    paths: ['.github/workflows/synthetic-view-review.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: net
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: giasonpooni/Geospatial-Systems-Compiler
          ref: 6255cbd916cf1c081ea2f680b6ef60122f782bdd
          path: gsc
          persist-credentials: false
      - name: Retain exact additive source sets, not a qualification result
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib, subprocess, zipfile
          net=pathlib.Path('net'); additions=[]
          for base,head in [('177b8f000df791d33ec612d80c1b81c4f681e306','ef4c55361b05740f6c58d1a2c065633481e4a1ad'),('e6b8809b13988caa43c6df51d38230c365e7526d','76075f9fa2235c109f800fd9d38a10cb6131c877')]:
              subprocess.run(['git','fetch','origin',head],cwd=net,check=True)
              changed=subprocess.check_output(['git','diff','--name-status',base,head],cwd=net,text=True).splitlines()
              for line in changed:
                  status,path=line.split('\t'); assert status=='A',line
                  assert not (net/path).exists(),path
                  data=subprocess.check_output(['git','show',head+':'+path],cwd=net)
                  blob=subprocess.check_output(['git','rev-parse',head+':'+path],cwd=net,text=True).strip()
                  (net/path).parent.mkdir(parents=True,exist_ok=True);(net/path).write_bytes(data)
                  additions.append({'path':path,'mode':'100644','type':'blob','sha':blob,'source_revision':head})
          pathlib.Path('composition.json').write_text(json.dumps(additions,indent=2))
          with zipfile.ZipFile('review-source.zip','w',zipfile.ZIP_DEFLATED) as out:
              out.write('composition.json')
              for directory in ('net','gsc'):
                  root=pathlib.Path(directory)
                  tracked=subprocess.check_output(['git','ls-files','-z'],cwd=root).decode().split('\0')
                  paths=set(p for p in tracked if p)
                  if directory=='net':paths.update(a['path'] for a in additions)
                  for path in sorted(paths):
                      file=root/path
                      if file.is_file() and not file.is_symlink():out.write(file)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: synthetic-view-reviewed-source
          path: review-source.zip
          if-no-files-found: error
