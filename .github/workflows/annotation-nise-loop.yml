name: Annotation to NISE to NET loop
on:
  pull_request:
    paths:
      - 'src/ciw/annotation_nise.py'
      - 'src/ciw/annotation_cli.py'
      - 'src/ciw/nise_handoff.py'
      - 'tests/test_annotation_nise.py'
      - 'docs/ANNOTATION_NISE_LOOP.md'
      - '.github/workflows/annotation-nise-loop.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  loop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: giasonpooni/Notations-Inference-Schematics-Engine
          ref: 42d1239d1be7cd515c5a57cbc4b98a2d31722051
          path: external/nise
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]' build
      - run: python -m pip install ./external/nise
      - name: Annotation→NISE bridge tests
        run: python -m pytest -q tests/test_annotation_nise.py tests/test_annotations.py tests/test_nise_handoff.py --junitxml=annotation-nise-tests.xml
      - name: Full human-notation to NET-plan specimen
        shell: bash
        run: |
          tmp="$(mktemp -d)"
          python - <<'PY' "$tmp"
          import json,pathlib,sys
          root=pathlib.Path(sys.argv[1])
          spec={
            "author":{"kind":"human","id":"engineer-17"},
            "authored_at":"2026-09-29T14:15:00-04:00",
            "target":{"kind":"ENTITY","id":"oscillator","version":"sha256:"+"a"*64},
            "kind":"QUESTION",
            "content":{"text":"Inspect the retained oscillator observations.","structured":{"intent":"inspect"}},
            "evidence_refs":["sha256:"+"2"*64],
            "model_refs":["analytic-damped-oscillator.v1"],
            "operation_refs":[],
            "requested_operations":["analysis.statistics.v1","analysis.spectrum.v1"],
            "confidence":None,
            "status":"OPEN",
            "supersedes":None
          }
          (root/'annotation-spec.json').write_text(json.dumps(spec))
          PY
          python -m ciw.net annotation create "$tmp/annotation-spec.json" --output "$tmp/annotation.json"
          python - <<'PY' "$tmp/annotation.json" "$tmp/seed.json"
          import json,sys
          a=json.load(open(sys.argv[1]))
          seed={
            "schema":"ciw.annotation-nise-seed.v1",
            "seed_id":"ci-seed-001",
            "annotation_ref":a["record_digest"],
            "query_id":"annotation-oscillator-investigation",
            "focus_node_ids":["oscillator"],
            "additional_capabilities":[],
            "max_hops":2,
            "node_budget":16,
            "include_hypotheses":False
          }
          json.dump(seed,open(sys.argv[2],'w'),indent=2)
          PY
          python -m ciw.net annotation nise-query "$tmp/annotation.json" "$tmp/seed.json"             --query-output "$tmp/query.json" --receipt-output "$tmp/annotation-nise.json"
          cat > "$tmp/catalog.json" <<'JSON'
          {
            "schema":"nise.system-catalog.v1",
            "catalog_id":"annotation-loop-fixture",
            "nodes":[
              {"node_id":"oscillator","kind":"ENTITY","label":"Oscillator","status":"DECLARED","attributes":{},"evidence_refs":[]},
              {"node_id":"op.stats","kind":"OPERATION","label":"Statistics","status":"DECLARED","attributes":{"semantic_capability":"analysis.statistics.v1"},"evidence_refs":[]},
              {"node_id":"op.spectrum","kind":"OPERATION","label":"Spectrum","status":"DECLARED","attributes":{"semantic_capability":"analysis.spectrum.v1"},"evidence_refs":[]}
            ],
            "edges":[
              {"edge_id":"e1","source":"oscillator","target":"op.stats","relation":"inspected_by","status":"DECLARED","directional":false,"evidence_refs":[],"attributes":{}},
              {"edge_id":"e2","source":"oscillator","target":"op.spectrum","relation":"inspected_by","status":"DECLARED","directional":false,"evidence_refs":[],"attributes":{}}
            ],
            "metadata":{"scope":"synthetic annotation loop fixture"}
          }
          JSON
          nise compile "$tmp/catalog.json" "$tmp/query.json" --output "$tmp/schematic.json"
          python - <<'PY' "$tmp/schematic.json" "$tmp/binding.json"
          import json,sys
          s=json.load(open(sys.argv[1]))
          b={
            "schema":"ciw.nise-binding-plan.v1",
            "binding_id":"annotation-loop-binding",
            "schematic_id":s["schematic_id"],
            "graph_id":"annotation-loop-graph",
            "model_id":"analytic-damped-oscillator.v1",
            "nodes":[
              {"nise_node_id":"op.stats","node_id":"statistics","parameters":{"channel":"q"},"inputs":{},"depends_on":[],"resources":["cpu"],"acceptance":{},"inspection":False},
              {"nise_node_id":"op.spectrum","node_id":"spectrum","parameters":{"channel":"q"},"inputs":{},"depends_on":["statistics"],"resources":["cpu"],"acceptance":{},"inspection":False}
            ]
          }
          json.dump(b,open(sys.argv[2],'w'),indent=2)
          PY
          python -m ciw.net nise compile-handoff "$tmp/schematic.json" "$tmp/binding.json" --output "$tmp/handoff.json"
          python - <<'PY' "$tmp/annotation.json" "$tmp/annotation-nise.json" "$tmp/schematic.json" "$tmp/handoff.json"
          import json,sys
          a,r,s,h=[json.load(open(path)) for path in sys.argv[1:]]
          assert r["annotation_ref"]==a["record_digest"]
          assert r["claims"]["semantic_retrieval_performed"] is False
          assert s["claims"]["physical_truth_established"] is False
          assert h["claims"]["execution_authority"] is False
          assert [n["operation_id"] for n in h["semantic_compilation"]["experiment"]["nodes"]]==["statistics.v1","spectrum.periodogram.v1"]
          PY
      - name: Require zero failures/errors/skips
        shell: bash
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as E
          suites=list(E.parse('annotation-nise-tests.xml').getroot().iter('testsuite'))
          assert sum(int(s.attrib['tests']) for s in suites) >= 25
          assert all(int(s.attrib[k]) == 0 for s in suites for k in ('failures','errors','skipped'))
          PY
          git diff --check
