name: Semantic capability compiler
on:
  pull_request:
    paths:
      - 'src/ciw/semantic_*.py'
      - 'src/ciw/net.py'
      - 'src/ciw/control_plane.py'
      - 'src/ciw/agent_mcp.py'
      - 'src/ciw/agent_tools.py'
      - 'tests/test_semantic_capabilities.py'
      - 'docs/SEMANTIC_CAPABILITIES.md'
      - '.github/workflows/semantic-capabilities.yml'
      - 'pyproject.toml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]' build
      - name: Semantic compiler and unchanged controller/MCP contracts
        run: python -m pytest -q tests/test_semantic_capabilities.py tests/test_control_plane.py tests/test_agent_protocol.py --junitxml=semantic-tests.xml
      - name: Require complete unskipped semantic qualification
        shell: bash
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as E
          suites=list(E.parse('semantic-tests.xml').getroot().iter('testsuite'))
          assert sum(int(s.attrib['tests']) for s in suites) >= 27
          assert all(int(s.attrib[k]) == 0 for s in suites for k in ('failures','errors','skipped'))
          PY
          git diff --check
      - run: python -m build --wheel
      - name: Installed wheel semantic CLI outside checkout
        shell: bash
        run: |
          python - <<'PY'
          import os,pathlib,shutil,subprocess,sys,tempfile
          wheel=next(pathlib.Path('dist').glob('*.whl')).resolve()
          subprocess.run([sys.executable,'-m','pip','install','--force-reinstall','--no-deps',str(wheel)],check=True)
          with tempfile.TemporaryDirectory() as tmp:
              root=pathlib.Path(tmp)
              env={k:v for k,v in os.environ.items() if k!='PYTHONPATH'}
              subprocess.run([sys.executable,'-m','ciw.net','semantic','catalog'],cwd=root,env=env,check=True,
                             stdout=subprocess.DEVNULL)
              subprocess.run([sys.executable,'-m','ciw.net','semantic','demo','--output-dir',str(root/'demo')],
                             cwd=root,env=env,check=True)
              assert (root/'demo'/'experiment.json').is_file()
              assert (root/'demo'/'semantic-compilation.json').is_file()
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: semantic-capabilities-${{ matrix.os }}
          if-no-files-found: error
          path: |
            semantic-tests.xml
            dist/*.whl
