name: NET production work orders
on:
  pull_request:
    paths:
      - 'src/ciw/production*.py'
      - 'src/ciw/net.py'
      - 'src/ciw/control_*.py'
      - 'src/ciw/game_*.py'
      - 'src/ciw/session.py'
      - 'src/ciw/core/**'
      - 'src/ciw/operations/**'
      - 'tests/test_production.py'
      - 'tests/test_game_*.py'
      - 'scripts/check_production.py'
      - 'tools/game-development/**'
      - '.github/workflows/net-production.yml'
      - 'pyproject.toml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]' build
      - name: Production and unchanged Session/control/game regressions
        run: python -m pytest -q tests/test_production.py tests/test_game_trace.py tests/test_game_session.py tests/test_game_retention.py tests/test_control_plane.py tests/test_interactive_contract.py tests/test_interactive_session.py -o addopts= --junitxml=production-tests.xml
      - name: Require complete unskipped qualification
        shell: bash
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          suites = list(ET.parse('production-tests.xml').getroot().iter('testsuite'))
          assert sum(int(s.attrib['tests']) for s in suites) >= 291
          assert all(int(s.attrib[k]) == 0 for s in suites for k in ('failures', 'errors', 'skipped'))
          PY
          git diff --check
      - run: python -m build --wheel
      - name: Installed wheel tests and production CLI outside checkout
        shell: bash
        run: |
          python - <<'PY'
          import os, pathlib, shutil, subprocess, sys, tempfile
          wheel = next(pathlib.Path('dist').glob('*.whl')).resolve()
          subprocess.run([sys.executable, '-m', 'pip', 'install', '--force-reinstall', '--no-deps', str(wheel)], check=True)
          report = pathlib.Path('production-installed.xml').resolve()
          with tempfile.TemporaryDirectory() as tmp:
              root = pathlib.Path(tmp)
              for name in ('test_production.py', 'test_game_trace.py', 'test_game_session.py'):
                  shutil.copy2(pathlib.Path('tests') / name, root / name)
              env = {k:v for k,v in os.environ.items() if k != 'PYTHONPATH'}
              subprocess.run([sys.executable, '-m', 'pytest', '-q', str(root), '-o', 'addopts=', '--junitxml=' + str(report)], cwd=root, env=env, check=True)
              subprocess.run([sys.executable, '-m', 'ciw.production_workflow', 'demo', '--output-dir', str(root/'demo')], cwd=root, env=env, check=True)
              subprocess.run([sys.executable, '-m', 'ciw.production_workflow', 'inspect', str(root/'demo'), '--profile', 'builtin'], cwd=root, env=env, check=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: production-contracts-${{ matrix.os }}
          if-no-files-found: error
          path: |
            production-tests.xml
            production-installed.xml
            dist/*.whl
  native:
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Bind the existing qualified Godot release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/production-tools"
          cd "$RUNNER_TEMP/production-tools"
          curl --fail --location --retry 2 -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.5.2-stable/Godot_v4.5.2-stable_linux.x86_64.zip
          echo '87f6e6be292929e363d15ed9052f277b2ba4e95ed994e1e099048097be2dfd03  godot.zip' | sha256sum --check
          unzip -q godot.zip
          chmod +x Godot_v4.5.2-stable_linux.x86_64
      - name: Build and install candidate wheel
        run: |
          python -m pip install build
          python -m build --wheel
          python -m pip install dist/*.whl
      - name: Actual native production, diagnosis, repairs, holds and refusal
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          env -u PYTHONPATH python "$GITHUB_WORKSPACE/scripts/check_production.py" \
            --godot "$RUNNER_TEMP/production-tools/Godot_v4.5.2-stable_linux.x86_64" \
            --adapter-root "$GITHUB_WORKSPACE/tools/game-development/godot" \
            --output-dir "$GITHUB_WORKSPACE/results/production-native"
      - name: Retain exact qualification source
        if: always()
        run: git archive --format=zip --output=production-source.zip HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: production-native-evidence
          if-no-files-found: error
          path: |
            results/production-native
            production-source.zip
            dist/*.whl
