name: Pinned Windows migration verification

on:
  push:
    branches: ['verify/monorepo-windows-20261003']

permissions:
  contents: read

jobs:
  windows-migration:
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    env:
      PYTHONPATH: ${{ github.workspace }}/src
      PYTHONNOUSERSITE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 33c76fbb9a8c0c4a5bf2cdb62b6a5f8b280c115c
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install declared guard dependencies
        run: python -m pip install 'numpy==2.4.3' 'websockets==16.0' 'pytest==9.0.2'
      - name: Create evidence directory
        run: python -c "from pathlib import Path; Path('results/windows-migration').mkdir(parents=True, exist_ok=True)"
      - name: Bind exact source before execution
        run: python -c "import sys,json; sys.path.insert(0,'scripts'); import monorepo; source=monorepo.verify_terminal_source(); assert source['revision']=='33c76fbb9a8c0c4a5bf2cdb62b6a5f8b280c115c'; print(json.dumps({'terminal_source':source,'imports':monorepo.verify_imports()}))" > results/windows-migration/source-before.json
      - name: Exercise migration, route refusal and worktree guards
        run: python -m pytest -q tests/test_monorepo.py tests/test_superrepo.py tests/test_worktree_lock.py --junitxml results/windows-migration/guards.xml
      - name: Audit exact source after execution
        run: python -c "import sys,json; sys.path.insert(0,'scripts'); import monorepo; source=monorepo.verify_terminal_source(); assert source['revision']=='33c76fbb9a8c0c4a5bf2cdb62b6a5f8b280c115c'; print(json.dumps({'terminal_source':source,'imports':monorepo.verify_imports()}))" > results/windows-migration/source-after.json
      - name: Retain scoped Windows verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinned-windows-migration-python-${{ matrix.python }}
          path: results/windows-migration/
          if-no-files-found: error
