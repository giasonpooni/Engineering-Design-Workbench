name: Persistent simulation contracts and Godot client
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - name: Require controller and real OS-pipe contracts
        run: python -m unittest discover -s tests -p 'test_persistent*.py' -v
      - name: Preserve original polyglot integration tests
        run: python -m unittest discover -s tests -p 'test_polyglot*.py' -v
      - name: Download the existing Godot Standard target
        run: |
          curl --fail --location --retry 3 'https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.5.2' --output "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.5.2-stable_linux.x86_64"
      - name: Actual Godot scene against a labelled controller fixture, not native evidence
        run: python tests/check_simulation_godot.py --godot "$RUNNER_TEMP/godot/Godot_v4.5.2-stable_linux.x86_64" --output-dir "$RUNNER_TEMP/simulation-ui"
      - name: Build the installed extension
        run: python -m pip wheel --no-deps . --wheel-dir dist-persistent
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: persistent-simulation-wheel
          path: dist-persistent/*.whl
          if-no-files-found: error
