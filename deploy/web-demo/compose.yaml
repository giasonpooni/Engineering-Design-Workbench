services:
  demo:
    build:
      context: ../..
      dockerfile: deploy/web-demo/Dockerfile
    image: net-scientific-demo:local
    # Bind locally; terminate public HTTPS using the separately configured proxy.
    ports:
      - "127.0.0.1:${NET_DEMO_PORT:-4173}:4173"
    command:
      - python
      - -I
      - -m
      - ciw.demo_server
      - --gsie-repo
      - /opt/net-providers/gsie
      - --jspt-repo
      - /opt/net-providers/jspt
      - --host
      - 0.0.0.0
      - --port
      - "4173"
      - --public-origin
      - "${NET_DEMO_ORIGIN:-http://127.0.0.1:4173}"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    cpus: "2.0"
    mem_limit: 3g
    stop_grace_period: 15s
    restart: "on-failure:3"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
