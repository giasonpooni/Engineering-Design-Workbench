[package]
name = "scr-provider-host"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
build = "build.rs"

# Dependency-heavy process/FFI boundary; frozen identity crates stay unchanged.
[workspace]

[dependencies]
execution-core = { path = "../execution-core" }
cxx = "=1.0.202"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["raw_value", "float_roundtrip"] }

[build-dependencies]
cxx-build = "=1.0.202"
execution-commitment = { path = "../execution-commitment" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"
