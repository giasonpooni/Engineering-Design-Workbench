[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "metrological-calibration-and-uncertainty-runtime"
version = "0.1.0"
description = "Bounded affine measurement calibration and correlated first-order uncertainty propagation."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MPL-2.0"}
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=7"]
exchange = ["state-estimation-testbed @ git+https://github.com/giasonpooni/State-Estimation-Evaluation-Testbed.git@c4d39c755187796ce2c72552a90454871c516c8f"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
